<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設定 | LUNAGS 管理システム</title>
    <link rel="stylesheet" href="../../shared/normalize.css">
    <link rel="stylesheet" href="../../shared/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./dashboard.css">
</head>

<body>

    <button class="hamburger" id="hamburgerBtn">
        <i class="fas fa-bars"></i>
    </button>

    <div class="page">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__brand">
                <img src="../../images/logo_LUNAGS.png" alt="LUNAGS">
                <div class="sidebar__brand-divider"></div>
                <span class="sidebar__brand-subtitle">MANAGEMENT SYSTEM</span>
            </div>

            <div class="menu-list">

                <!-- ランチャー -->
                <a href="../../launcher.html" class="menu">
                    <i class="fa-solid fa-table-cells-large"></i>
                    <span>ランチャー</span>
                </a>

                <!-- ダッシュボード -->
                <a class="menu" href="./dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span>ダッシュボード</span>
                </a>

                <!-- カレンダー -->
                <a class="menu" href="./calendar.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>カレンダー</span>
                </a>

                <!-- ポスト -->
                <a class="menu" href="./posts.html">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>ポスト</span>
                </a>

                <!-- タスク -->
                <a class="menu" href="./tasks.html">
                    <i class="fa-solid fa-list-check"></i>
                    <span>タスク</span>
                </a>

                <div class="sidebar__divider"></div>

                <!-- 統計 -->
                <a class="menu" href="./statistics.html">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>統計</span>
                </a>

                <!-- 設定 -->
                <a class="menu active" href="./settings.html">
                    <i class="fa-solid fa-gear"></i>
                    <span>設定</span>
                </a>
            </div>

            <div class="sidebar__footer">
                <a class="sidebar__mypage-btn" href="../../account/mypage/profile.html">
                    <i class="fa-solid fa-user"></i>
                    <span>マイページへ戻る</span>
                </a>
            </div>
        </aside>

        <main class="main fade-in">
            <header class="topbar">
                <div>
                    <h1 class="topbar__title">SETTINGS</h1>
                    <div class="topbar__date">通知とメンバー候補の基本設定</div>
                </div>
                <div class="topbar__right">
                    <div class="notif">
                        <button class="notif__btn" id="notifBtn" aria-label="通知"><i class="fa-solid fa-bell"
                                style="font-size: 1.25rem;"></i><span class="notif__badge is-hidden"
                                id="notifBadge">0</span></button>
                        <div class="notif__dropdown" id="notifDropdown">
                            <div class="notif__dropdown-title"
                                style="display: flex; justify-content: space-between; align-items: center;">
                                通知
                                <button id="markAllReadBtn" class="btn-secondary"
                                    style="font-size: 0.75rem; min-height: 24px; padding: 0 8px;">すべて既読</button>
                            </div>
                            <div id="notifList"></div>
                        </div>
                    </div>
                </div>
            </header>

            <section class="settings-grid">
                <div class="card">
                    <div class="card__head">
                        <h2>基本設定</h2>
                    </div>
                    <form id="settingsForm" class="form-grid">
                        <div class="form-group span-2"><label for="currentUser">現在の表示名</label><input class="field"
                                id="currentUser" type="text" placeholder="例：なぎさ"></div>
                        <div class="span-2 toolbar"><button class="btn-primary" type="submit">保存</button></div>
                    </form>
                    <p class="small-note">ここで登録した名前は、ポストとタスクの担当者入力候補、統計ページの集計対象として使われます。</p>
                </div>

                <div class="card">
                    <div class="card__head">
                        <h2>登録メンバー</h2><span class="count" id="memberCount">0人</span>
                    </div>
                    <div class="list-stack" id="memberList"></div>
                </div>
            </section>
        </main>
    </div>

    <div class="toast-stack" id="toastStack"></div>

    <script type="module">
        import { auth, db } from "../../shared/firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { doc, getDoc, setDoc, collection, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
        import { getUnreadCount, markAllAsRead, sortNotifications, createNotificationHTML } from "./notification.js";

        const STORAGE_KEYS = { settings: "lunags_settings", notifications: "lunags_notifications" };
        const fallbackSettings = { currentUser: "なぎさ", members: ["なぎさ", "ミク", "レン", "リン"] };
        let settings = readSettings();
        let notifications = [];
        const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));

        let currentUserAuth = null;
        let currentUserId = null;
        let unsubscribeMembers = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserAuth = user;
                try {
                    const mapSnap = await getDoc(doc(db, "uidMap", user.uid));
                    if (mapSnap.exists()) {
                        currentUserId = mapSnap.data().userId;
                        const userSnap = await getDoc(doc(db, "users", currentUserId));
                        if (userSnap.exists()) {
                            const data = userSnap.data();
                            if (data.displayName && data.displayName !== settings.currentUser) {
                                const oldName = settings.currentUser;
                                const newName = data.displayName;
                                settings.currentUser = newName;

                                writeSettings(false);
                            }
                        }
                    }
                } catch (error) {
                    console.error("Firebase読み込みエラー:", error);
                }

                if (!unsubscribeMembers) {
                    unsubscribeMembers = watchMembers();
                }

            } else {
                window.location.href = "../../account/login/login.html";
            }
        });

        function readLocal(key) {
            try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch { return []; }
        }

        function readSettings() {
            try { return { ...fallbackSettings, ...(JSON.parse(localStorage.getItem(STORAGE_KEYS.settings) || "{}")) }; } catch { return fallbackSettings; }
        }

        function writeSettings(showToastMsg = true) {
            localStorage.setItem(
                STORAGE_KEYS.settings,
                JSON.stringify(settings)
            );

            document.getElementById("currentUser").value = settings.currentUser || "";

            if (showToastMsg) {
                showToast("設定を保存しました。");
            }
        }

        function renderSettings() {
            document.getElementById("currentUser").value = settings.currentUser || "";
            document.getElementById("memberCount").textContent = `${settings.members.length}人`;
            document.getElementById("memberList").innerHTML = settings.members.length ? settings.members.map((name) => `
                <div class="member-row">
    <div>
        <strong>${escapeHtml(name)}</strong>
        ${name === settings.currentUser ? `<div class="small-note">現在の表示名</div>` : ""}
    </div>
</div>
            `).join("") : `<div class="empty-state">メンバーが登録されていません。</div>`;
        }

        function watchMembers() {
            return onSnapshot(
                collection(db, "users"),
                (snapshot) => {

                    settings.members = snapshot.docs
                        .map(doc => doc.data().displayName || "未設定")
                        .sort((a, b) => a.localeCompare(b, "ja"));

                    renderSettings();

                },
                (error) => {
                    console.error("メンバー取得エラー:", error);
                }
            );
        }

        function renderNotifications() {
            notifications = readLocal(STORAGE_KEYS.notifications);
            const badge = document.getElementById("notifBadge");
            const list = document.getElementById("notifList");
            const sorted = sortNotifications(notifications);
            const unreadCount = getUnreadCount(sorted);
            badge.textContent = unreadCount > 9 ? "9+" : String(unreadCount);
            badge.classList.toggle("is-hidden", unreadCount === 0);
            list.innerHTML = createNotificationHTML(sorted.slice(0, 20), escapeHtml);
        }

        function showToast(text) {
            const stack = document.getElementById("toastStack");
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.textContent = text;
            stack.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add("is-visible"));
            setTimeout(() => { toast.classList.remove("is-visible"); setTimeout(() => toast.remove(), 220); }, 3200);
        }

        function initEvents() {
            document.getElementById("markAllReadBtn").addEventListener("click", async (event) => {
                event.stopPropagation();
                notifications = markAllAsRead(notifications);
                localStorage.setItem(STORAGE_KEYS.notifications, JSON.stringify(notifications));
                renderNotifications();
                try {
                    const updates = notifications.map(n => updateDoc(doc(db, "notifications", n.id), { unread: false }));
                    await Promise.all(updates);
                } catch (error) {
                    console.error("Firestore通知の既読更新に失敗:", error);
                }
            });
            document.getElementById("settingsForm").addEventListener("submit", async (event) => {
                event.preventDefault();
                const oldName = settings.currentUser;
                const newName = document.getElementById("currentUser").value.trim();

                if (newName && newName !== oldName) {
                    settings.currentUser = newName;

                    const index = settings.members.indexOf(oldName);
                    if (index !== -1) {
                        settings.members[index] = newName;
                    } else if (!settings.members.includes(newName)) {
                        settings.members.unshift(newName);
                    }
                }

                writeSettings();

                // データベースにも保存する
                if (currentUserAuth && currentUserId) {
                    try {
                        const userRef = doc(db, "users", currentUserId);
                        await setDoc(userRef, { displayName: settings.currentUser }, { merge: true });
                    } catch (error) {
                        console.error("Firebaseの更新に失敗しました:", error);
                    }
                }
            });
            const notifBtn = document.getElementById("notifBtn");
            const notifDropdown = document.getElementById("notifDropdown");
            notifBtn.addEventListener("click", (event) => { event.stopPropagation(); notifDropdown.classList.toggle("is-open"); });
            document.addEventListener("click", (event) => { if (!notifDropdown.contains(event.target) && event.target !== notifBtn) notifDropdown.classList.remove("is-open"); });
            document.addEventListener("click", (event) => { if (window.innerWidth <= 900 && !sidebar.contains(event.target) && !hamburgerBtn.contains(event.target)) sidebar.classList.remove("open"); });
        }

        initEvents();
        renderNotifications();

        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebar = document.getElementById("sidebar");

        hamburgerBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
        });
    </script>
</body>

</html>
