<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>確認コード認証 | LUNAGS Account</title>
    <link rel="stylesheet" href="../../shared/normalize.css">
    <link rel="stylesheet" href="../../shared/common.css">
    <link rel="stylesheet" href="./login.css">
</head>

<body>
    <div class="box">
        <h2>確認コード認証</h2>
        <p id="emailLabel"></p>
        <input id="code" inputmode="text" autocomplete="one-time-code" placeholder="確認コード">
        <div id="message" class="message"></div>
        <button id="verifyButton">認証する</button>
        <button class="secondary" onclick="location.href='./signup.html'">新規登録へ戻る</button>
    </div>

    <script type="module">
        import { doc, runTransaction } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
        import {
            db,
            sha256,
            loadPendingSignup,
            clearPendingSignup,
            withTimeout,
            getFriendlyErrorMessage
        } from "../../shared/firebase-config.js";

        function setMessage(text, type = "") {
            const message = document.getElementById("message");
            message.className = `message ${type}`;
            message.innerText = text;
        }

        window.addEventListener("DOMContentLoaded", () => {
            const pendingSignup = loadPendingSignup();

            if (!pendingSignup?.email || !pendingSignup?.userId) {
                window.location.href = "signup.html";
                return;
            }

            const email = pendingSignup.email;
            const userId = pendingSignup.userId;
            document.getElementById("emailLabel").innerText = email;

            window.verifyCode = async () => {
                const button = document.getElementById("verifyButton");
                const inputCode = document.getElementById("code").value.trim();

                if (!inputCode) {
                    setMessage("コードを入力してください", "error");
                    return;
                }

                button.disabled = true;
                setMessage("コードを確認しています...");

                try {
                    if (!/^\d{6}$/.test(inputCode)) {
                        setMessage("6桁の確認コードを入力してください", "error");
                        return;
                    }

                    // ========================================
                    // 6桁コード認証 (users/{userId} の emailVerification)
                    // ========================================

                    const inputHash = await sha256(inputCode);
                    const userRef = doc(db, "users", userId);

                    const result = await withTimeout(
                        runTransaction(db, async (transaction) => {
                            const snap = await transaction.get(userRef);

                            if (!snap.exists()) {
                                return {
                                    ok: false,
                                    message: "登録情報が見つかりません。最初からやり直してください。",
                                    cleanup: true
                                };
                            }

                            const data = snap.data() || {};
                            const verification = data.emailVerification;

                            if (!verification) {
                                return {
                                    ok: false,
                                    message: "確認コード情報が見つかりません。最初からやり直してください。",
                                    cleanup: true
                                };
                            }

                            if (verification.verified) {
                                return { ok: true, message: "すでに認証済みです" };
                            }

                            if (Date.now() > verification.expiresAt) {
                                return {
                                    ok: false,
                                    message: "有効期限が切れました。最初からやり直してください。",
                                    cleanup: true
                                };
                            }

                            if (verification.attemptCount >= verification.maxAttempts) {
                                return {
                                    ok: false,
                                    message: "試行回数の上限に達しました。最初からやり直してください。",
                                    cleanup: true
                                };
                            }

                            if (verification.codeHash !== inputHash) {
                                const next = (verification.attemptCount || 0) + 1;

                                if (next >= verification.maxAttempts) {
                                    return {
                                        ok: false,
                                        message: "試行回数の上限に達しました。最初からやり直してください。",
                                        cleanup: true
                                    };
                                }

                                transaction.update(userRef, {
                                    "emailVerification.attemptCount": next,
                                    "emailVerification.updatedAt": Date.now()
                                });

                                return {
                                    ok: false,
                                    message: `コードが違います（残り ${verification.maxAttempts - next} 回）`
                                };
                            }

                            transaction.update(userRef, {
                                "emailVerification.verified": true,
                                "emailVerification.verifiedAt": Date.now(),
                                "emailVerification.updatedAt": Date.now()
                            });

                            return { ok: true, message: "認証が完了しました" };
                        })
                    );

                    if (!result.ok) {
                        setMessage(result.message, "error");

                        if (result.cleanup) {
                            clearPendingSignup();
                            setTimeout(() => {
                                window.location.href = "./signup.html";
                            }, 1500);
                        }

                        return;
                    }

                    setMessage(result.message, "success");

                    setTimeout(() => {
                        window.location.href = "set-password.html";
                    }, 800);

                } catch (error) {
                    setMessage(
                        getFriendlyErrorMessage(
                            error,
                            "確認コード認証に失敗しました"
                        ),
                        "error"
                    );
                } finally {
                    button.disabled = false;
                }
            };

            document.getElementById("verifyButton").addEventListener(
                "click",
                window.verifyCode
            );
        });
    </script>
</body>

</html>
