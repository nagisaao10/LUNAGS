<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>確認コード認証 | LUNAGS Account</title>

    <link rel="stylesheet" href="../../shared/normalize.css">
    <link rel="stylesheet" href="../../shared/common.css">
    <link rel="stylesheet" href="./login.css">
</head>

<body>

    <div class="box">

        <h2>確認コード認証</h2>

        <p id="emailLabel"></p>

        <input id="code" inputmode="text" autocomplete="one-time-code" placeholder="確認コード">

        <div id="message" class="message"></div>

        <button id="verifyButton">
            認証する
        </button>

        <button class="secondary" onclick="location.href='./signup.html'">
            新規登録へ戻る
        </button>

    </div>


    <script type="module">

        import {
            doc,
            getDoc,
            updateDoc,
            deleteDoc
        } from
            "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        import {
            db,
            sha256,
            loadPendingSignup,
            clearPendingSignup,
            withTimeout,
            getFriendlyErrorMessage
        } from
            "../../shared/firebase-config.js";


        function setMessage(
            text,
            type = ""
        ) {

            const message =
                document.getElementById(
                    "message"
                );

            message.className =
                `message ${type}`;

            message.innerText =
                text;
        }


        window.addEventListener(
            "DOMContentLoaded",
            () => {

                const pendingSignup =
                    loadPendingSignup();


                if (
                    !pendingSignup?.email ||
                    !pendingSignup?.userId
                ) {

                    window.location.href =
                        "./signup.html";

                    return;
                }


                const email =
                    pendingSignup.email;

                const userId =
                    pendingSignup.userId;


                document.getElementById(
                    "emailLabel"
                ).innerText = email;


                const button =
                    document.getElementById(
                        "verifyButton"
                    );


                button.addEventListener(
                    "click",
                    async () => {

                        const inputCode =
                            document.getElementById(
                                "code"
                            ).value.trim();


                        if (!inputCode) {

                            setMessage(
                                "コードを入力してください",
                                "error"
                            );

                            return;
                        }


                        if (
                            !/^\d{6}$/.test(
                                inputCode
                            )
                        ) {

                            setMessage(
                                "6桁の確認コードを入力してください",
                                "error"
                            );

                            return;
                        }


                        button.disabled = true;

                        setMessage(
                            "コードを確認しています..."
                        );


                        try {

                            const inputHash =
                                await sha256(
                                    inputCode
                                );


                            const ref =
                                doc(
                                    db,
                                    "users",
                                    userId
                                );


                            const snap =
                                await withTimeout(
                                    getDoc(ref)
                                );


                            if (!snap.exists()) {

                                throw new Error(
                                    "登録情報が見つかりません。最初からやり直してください。"
                                );
                            }


                            const data =
                                snap.data();


                            const verification =
                                data.emailVerification;


                            if (!verification) {

                                throw new Error(
                                    "確認コード情報が見つかりません。最初からやり直してください。"
                                );
                            }


                            /*
                             * すでに認証済み
                             */

                            if (
                                verification.verified
                            ) {

                                setMessage(
                                    "すでに認証済みです",
                                    "success"
                                );


                                setTimeout(() => {

                                    window.location.href =
                                        "./set-password.html";

                                }, 500);

                                return;
                            }


                            /*
                             * 有効期限
                             */

                            if (
                                Date.now() >
                                verification.expiresAt
                            ) {

                                await deleteDoc(
                                    ref
                                );


                                throw new Error(
                                    "確認コードの有効期限が切れています。最初からやり直してください。"
                                );
                            }


                            /*
                             * 試行回数
                             */

                            if (
                                verification.attemptCount >=
                                verification.maxAttempts
                            ) {

                                await deleteDoc(
                                    ref
                                );


                                throw new Error(
                                    "確認コードの試行回数上限に達しました。最初からやり直してください。"
                                );
                            }


                            /*
                             * コード比較
                             */

                            if (
                                verification.codeHash !==
                                inputHash
                            ) {

                                const nextAttempt =
                                    verification.attemptCount +
                                    1;


                                if (
                                    nextAttempt >=
                                    verification.maxAttempts
                                ) {

                                    await deleteDoc(
                                        ref
                                    );


                                    throw new Error(
                                        "確認コードの試行回数上限に達しました。最初からやり直してください。"
                                    );
                                }


                                await updateDoc(
                                    ref,
                                    {
                                        "emailVerification.attemptCount":
                                            nextAttempt,

                                        "emailVerification.updatedAt":
                                            new Date()
                                    }
                                );


                                setMessage(
                                    `コードが違います（残り ${verification.maxAttempts - nextAttempt} 回）`,
                                    "error"
                                );

                                return;
                            }


                            /*
                             * 認証成功
                             */

                            await updateDoc(
                                ref,
                                {
                                    "emailVerification.verified":
                                        true,

                                    "emailVerification.verifiedAt":
                                        new Date(),

                                    "emailVerification.updatedAt":
                                        new Date()
                                }
                            );


                            setMessage(
                                "認証が完了しました",
                                "success"
                            );


                            setTimeout(() => {

                                window.location.href =
                                    "./set-password.html";

                            }, 800);


                        } catch (error) {

                            console.error(
                                error
                            );


                            setMessage(
                                getFriendlyErrorMessage(
                                    error,
                                    "確認コード認証に失敗しました"
                                ),
                                "error"
                            );


                            if (
                                error.message?.includes(
                                    "最初からやり直してください"
                                )
                            ) {

                                setTimeout(() => {

                                    window.location.href =
                                        "./signup.html";

                                }, 1200);
                            }

                        } finally {

                            button.disabled = false;
                        }
                    }
                );
            }
        );

    </script>

</body>

</html>
