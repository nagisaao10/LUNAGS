<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 | LUNAGS Account</title>

    <link rel="stylesheet" href="../../shared/normalize.css">
    <link rel="stylesheet" href="../../shared/common.css">
    <link rel="stylesheet" href="./login.css">
</head>

<body>
    <div class="box">
        <h2>新規登録</h2>

        <p>
            名前とメールアドレスを入力すると、6桁の確認コードを送信します。
        </p>

        <input id="name" type="text" placeholder="ユーザー名">

        <input id="email" type="email" placeholder="メールアドレス">

        <div id="message" class="message"></div>

        <button type="button" id="submitButton" onclick="startSignup(event)">
            確認コードを送信
        </button>

        <button class="secondary" onclick="location.href='./login.html'">
            ログインへ戻る
        </button>
    </div>

    <script type="module">
        import {
            auth,
            db,
            serverTimestamp,
            CODE_TTL_MS,
            MAX_ATTEMPTS,
            normalizeEmail,
            generateCode,
            sha256,
            sendVerificationEmail,
            savePendingSignup,
            withTimeout,
            isOfflineDocumentError,
            getFriendlyErrorMessage,
            isSignupSkipEnabled,
            prepareSignupSkip,
            enableSignupSkip
        } from "../../shared/firebase-config.js";

        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
        import { fetchSignInMethodsForEmail } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        function setMessage(text, type = "") {
            const message = document.getElementById("message");
            if (message) {
                message.className = `message ${type}`;
                message.innerText = text;
            }
        }

        /*
         * ========================================
         * LUNAGS 新規登録スキップ API
         * ========================================
         */
        window.LUNAGS_signup = window.LUNAGS_signup || {};

        window.LUNAGS_signup.skip = async (password) => {
            try {
                await enableSignupSkip(password);
                console.log(
                    "LUNAGS_signup: 新規登録スキップモードを有効化しました"
                );
                return true;
            } catch (error) {
                console.error(
                    "LUNAGS_signup: 新規登録スキップモードの有効化に失敗しました",
                    error
                );
                return false;
            }
        };

        function generateUserId() {
            const letters =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
            const digits = "0123456789";
            const chars = letters + digits;

            while (true) {
                let id = "U";

                const bytes = crypto.getRandomValues(
                    new Uint8Array(7)
                );

                for (let i = 0; i < 7; i++) {
                    id += chars[bytes[i] % chars.length];
                }

                const body = id.slice(1);

                const digitCount = [...body].filter(char =>
                    digits.includes(char)
                ).length;

                const letterCount = [...body].filter(char =>
                    letters.includes(char)
                ).length;

                if (
                    digitCount < 2 ||
                    digitCount > 4 ||
                    letterCount < 3
                ) {
                    continue;
                }

                let hasTriple = false;

                for (let i = 2; i < id.length; i++) {
                    if (
                        id[i] === id[i - 1] &&
                        id[i] === id[i - 2]
                    ) {
                        hasTriple = true;
                        break;
                    }
                }

                if (!hasTriple) {
                    return id;
                }
            }
        }

        async function generateUniqueUserId() {
            while (true) {
                const userId = generateUserId();

                const snap = await getDoc(
                    doc(db, "users", userId)
                );

                if (!snap.exists()) {
                    return userId;
                }
            }
        }

        window.startSignup = async (event) => {
            event?.preventDefault();

            const button = event?.currentTarget ||
                document.getElementById("submitButton") ||
                document.querySelector("button");

            const name = document
                .getElementById("name")
                .value
                .trim();

            const email = normalizeEmail(
                document.getElementById("email").value
            );

            if (!name) {
                setMessage("ユーザー名を入力してください", "error");
                return;
            }

            if (!email) {
                setMessage("メールアドレスを入力してください", "error");
                return;
            }

            if (button) {
                button.disabled = true;
            }

            setMessage("確認中...");

            try {
                try {
                    const methods = await withTimeout(
                        fetchSignInMethodsForEmail(auth, email)
                    );

                    if (methods.length > 0) {
                        throw new Error(
                            "このメールアドレスはすでに登録されています"
                        );
                    }
                } catch (err) {
                    if (!isOfflineDocumentError(err) && err.message.includes("すでに登録されています")) {
                        throw err;
                    }
                }

                /*
                 * 登録スキップ
                 */
                if (isSignupSkipEnabled()) {
                    setMessage("新規登録スキップモードで登録しています...");

                    const userId = await generateUniqueUserId();
                    const userRef = doc(db, "users", userId);

                    await withTimeout(
                        setDoc(userRef, {
                            userId,
                            name,
                            displayName: name,
                            email,
                            status: "pending",
                            emailVerification: {
                                codeHash: "",
                                verified: true,
                                skipMode: true,
                                attemptCount: 0,
                                maxAttempts: MAX_ATTEMPTS,
                                expiresAt: Date.now() + CODE_TTL_MS,
                                createdAt: serverTimestamp(),
                                updatedAt: serverTimestamp()
                            },
                            createdAt: serverTimestamp(),
                            updatedAt: serverTimestamp()
                        })
                    );

                    savePendingSignup({
                        name,
                        email,
                        userId
                    });

                    try {
                        await prepareSignupSkip({
                            email,
                            name,
                            userId
                        });
                    } catch (skipErr) {
                        console.warn("prepareSignupSkip warning:", skipErr);
                    }

                    setMessage("確認をスキップしました", "success");

                    setTimeout(() => {
                        window.location.href = "./set-password.html";
                    }, 500);

                    return;
                }

                /*
                 * 通常登録
                 * 先にユーザーIDを確保する。
                 */
                setMessage("ユーザーIDを生成しています...");
                const userId = await generateUniqueUserId();

                const code = generateCode();
                const codeHash = await sha256(code);

                const userRef = doc(
                    db,
                    "users",
                    userId
                );

                /*
                 * users/{userId} に
                 * 登録途中のユーザーを作成。
                 */
                setMessage("確認コードを発行しています...");
                await withTimeout(
                    setDoc(userRef, {
                        userId,
                        name,
                        displayName: name,

                        email,

                        status: "pending",

                        emailVerification: {
                            codeHash,
                            verified: false,
                            attemptCount: 0,
                            maxAttempts: MAX_ATTEMPTS,
                            expiresAt:
                                Date.now() + CODE_TTL_MS,
                            createdAt: serverTimestamp(),
                            updatedAt: serverTimestamp()
                        },

                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp()
                    })
                );

                /*
                 * set-password.html / verify.html が
                 * 同じユーザーを参照できるように
                 * userIdも保存する。
                 */
                savePendingSignup({
                    name,
                    email,
                    userId
                });

                setMessage("確認コードをメール送信しています...");
                await sendVerificationEmail({
                    email,
                    code,
                    name
                });

                setMessage("確認コードを送信しました", "success");

                setTimeout(() => {
                    location.href = "./verify.html";
                }, 800);

            } catch (error) {
                console.error(error);

                setMessage(
                    getFriendlyErrorMessage(
                        error,
                        "登録処理に失敗しました"
                    ),
                    "error"
                );

            } finally {
                if (button) {
                    button.disabled = false;
                }
            }
        };
    </script>
</body>

</html>
