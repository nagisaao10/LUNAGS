<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 | LUNAGS Account</title>

    <link rel="stylesheet" href="../../shared/normalize.css">
    <link rel="stylesheet" href="../../shared/common.css">
    <link rel="stylesheet" href="./login.css">
</head>

<body>

    <div class="box">

        <h2>新規登録</h2>

        <p>
            名前とメールアドレスを入力すると、6桁の確認コードを送信します。
        </p>

        <input id="name" type="text" placeholder="ユーザー名" autocomplete="name">

        <input id="email" type="email" placeholder="メールアドレス" autocomplete="email">

        <div id="message" class="message"></div>

        <button type="button" id="submitButton" onclick="startSignup(event)">
            確認コードを送信
        </button>

        <button class="secondary" type="button" onclick="location.href='./login.html'">
            ログインへ戻る
        </button>

    </div>


    <script type="module">

        import {
            auth,
            normalizeEmail,
            withTimeout,
            isOfflineDocumentError,
            getFriendlyErrorMessage,
            isSignupSkipEnabled,
            prepareSignupSkip,
            savePendingSignup
        } from "../../shared/firebase-config.js";

        import {
            fetchSignInMethodsForEmail
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";


        /*
         * ========================================
         * 設定
         * ========================================
         */

        const SIGNUP_START_ENDPOINT =
            "https://us-central1-lunags.cloudfunctions.net/signupStart";


        /*
         * ========================================
         * メッセージ
         * ========================================
         */

        function setMessage(text, type = "") {

            const message =
                document.getElementById("message");

            message.className =
                `message ${type}`;

            message.innerText =
                text;
        }


        /*
         * ========================================
         * 新規登録スキップ
         * ========================================
         */

        window.LUNAGS_signup =
            window.LUNAGS_signup || {};

        window.LUNAGS_signup.skip =
            async (password) => {

                try {

                    const result =
                        await import(
                            "../../shared/firebase-config.js"
                        );

                    await result.enableSignupSkip(
                        password
                    );

                    console.log(
                        "LUNAGS_signup: 新規登録スキップモードを有効化しました"
                    );

                    return true;

                } catch (error) {

                    console.error(
                        "LUNAGS_signup: 新規登録スキップモードの有効化に失敗しました",
                        error
                    );

                    return false;
                }
            };


        /*
         * ========================================
         * メールアドレス重複確認
         * ========================================
         */

        async function checkExistingAccount(email) {

            try {

                const methods =
                    await withTimeout(
                        fetchSignInMethodsForEmail(
                            auth,
                            email
                        )
                    );

                return methods.length > 0;

            } catch (error) {

                if (
                    isOfflineDocumentError(error) ||
                    error?.code === "auth/invalid-email"
                ) {
                    return false;
                }

                throw error;
            }
        }


        /*
         * ========================================
         * signupStart API
         * ========================================
         */

        async function requestSignupStart({
            name,
            email
        }) {

            const response =
                await fetch(
                    SIGNUP_START_ENDPOINT,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name,
                            email
                        })
                    }
                );


            let data = null;

            try {

                data =
                    await response.json();

            } catch {

                throw new Error(
                    "サーバーから不正な応答が返されました"
                );
            }


            if (!response.ok) {

                const error =
                    new Error(
                        data?.message ||
                        "新規登録の開始に失敗しました"
                    );

                error.code =
                    data?.code ||
                    `http-${response.status}`;

                throw error;
            }


            if (
                !data ||
                data.success !== true
            ) {

                throw new Error(
                    data?.message ||
                    "新規登録の開始に失敗しました"
                );
            }


            return data;
        }


        /*
         * ========================================
         * 新規登録
         * ========================================
         */

        window.startSignup =
            async (event) => {

                event.preventDefault();


                const button =
                    document.getElementById(
                        "submitButton"
                    );


                const name =
                    document.getElementById(
                        "name"
                    )
                        .value
                        .trim();


                const email =
                    normalizeEmail(
                        document.getElementById(
                            "email"
                        ).value
                    );


                /*
                 * --------------------------------
                 * 入力チェック
                 * --------------------------------
                 */

                if (!name) {

                    setMessage(
                        "ユーザー名を入力してください",
                        "error"
                    );

                    return;
                }


                if (name.length > 50) {

                    setMessage(
                        "ユーザー名は50文字以内で入力してください",
                        "error"
                    );

                    return;
                }


                if (!email) {

                    setMessage(
                        "メールアドレスを入力してください",
                        "error"
                    );

                    return;
                }


                button.disabled = true;


                try {

                    /*
                     * --------------------------------
                     * 既存アカウント確認
                     * --------------------------------
                     */

                    setMessage(
                        "登録情報を確認しています..."
                    );


                    const exists =
                        await checkExistingAccount(
                            email
                        );


                    if (exists) {

                        throw new Error(
                            "このメールアドレスはすでに登録されています"
                        );
                    }


                    /*
                     * --------------------------------
                     * 新規登録スキップ
                     *
                     * 注意:
                     * userId生成やusers作成は
                     * Function側で行う。
                     * --------------------------------
                     */

                    if (isSignupSkipEnabled()) {

                        setMessage(
                            "新規登録スキップモードで登録しています..."
                        );


                        /*
                         * 既存のskip APIを実行
                         */
                        await prepareSignupSkip({
                            email,
                            name
                        });


                        /*
                         * signupStart Functionへ
                         *
                         * skipModeを明示的に渡す。
                         */
                        const result =
                            await requestSignupStart({
                                name,
                                email
                            });


                        /*
                         * pendingSignup
                         */
                        savePendingSignup({
                            name,
                            email,
                            userId:
                                result.userId
                        });


                        setMessage(
                            "確認をスキップしました",
                            "success"
                        );


                        setTimeout(() => {

                            window.location.href =
                                "./set-password.html";

                        }, 500);


                        return;
                    }


                    /*
                     * --------------------------------
                     * 通常登録
                     * --------------------------------
                     */

                    setMessage(
                        "登録情報を準備しています..."
                    );


                    /*
                     * Function側で以下を実行する:
                     *
                     * ・userId生成
                     * ・userId重複確認
                     * ・確認コード生成
                     * ・codeHash生成
                     * ・users/{userId}作成
                     * ・emailVerification保存
                     * ・確認メール送信
                     */
                    const result =
                        await requestSignupStart({
                            name,
                            email
                        });


                    /*
                     * --------------------------------
                     * pendingSignup
                     * --------------------------------
                     */

                    savePendingSignup({
                        name,
                        email,
                        userId:
                            result.userId
                    });


                    /*
                     * --------------------------------
                     * 完了
                     * --------------------------------
                     */

                    setMessage(
                        "確認コードを送信しました",
                        "success"
                    );


                    setTimeout(() => {

                        window.location.href =
                            "./verify.html";

                    }, 800);


                } catch (error) {

                    console.error(
                        "signup:",
                        error
                    );


                    setMessage(
                        getFriendlyErrorMessage(
                            error,
                            "新規登録に失敗しました"
                        ),
                        "error"
                    );


                } finally {

                    button.disabled = false;
                }
            };

    </script>

</body>

</html>
