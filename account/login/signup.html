                await fetch(

                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name,
                            email
                        })
                    }
                );


            let data = null;

            try {

                data =
                    await response.json();

            } catch {

                throw new Error(
                    "サーバーから不正な応答が返されました"
                );
            }


            if (!response.ok) {

                const error =
                    new Error(
                        data?.message ||
                        "新規登録の開始に失敗しました"
                    );

                error.code =
                    data?.code ||
                    `http-${response.status}`;

                throw error;
            }


            if (
                !data ||
                data.success !== true
            ) {

                throw new Error(
                    data?.message ||
                    "新規登録の開始に失敗しました"
                );
            }


            return data;
        }
