<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード設定 | LUNAGS Account</title>

    <link rel="stylesheet" href="../../shared/normalize.css">
    <link rel="stylesheet" href="../../shared/common.css">
    <link rel="stylesheet" href="./login.css">
</head>

<body>

    <div class="box">

        <h2>パスワード設定</h2>

        <p id="emailLabel"></p>

        <input id="password" type="password" placeholder="パスワード">

        <input id="password2" type="password" placeholder="パスワード確認">

        <div id="message" class="message"></div>

        <button id="registerButton" onclick="register()">
            登録する
        </button>

        <button id="loginButton" style="display:none;background:#eef2f7;color:#333;"
            onclick="location.href='login.html'">
            ログインに戻る
        </button>

        <button id="restartButton" style="display:none;background:#eef2f7;color:#333;"
            onclick="location.href='signup.html'">
            新規登録へ戻る
        </button>

    </div>


    <script type="module">

        import {
            createUserWithEmailAndPassword,
            fetchSignInMethodsForEmail,
            updateProfile
        } from
            "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";


        import {
            doc,
            getDoc,
            setDoc,
            deleteField
        } from
            "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


        import {
            auth,
            db,
            serverTimestamp,
            loadPendingSignup,
            clearPendingSignup,
            withTimeout,
            getFriendlyErrorMessage
        } from
            "../../shared/firebase-config.js";


        /*
         * ========================================
         * ユーザーID生成
         * ========================================
         */

        function generateUserId() {

            const letters =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";

            const digits =
                "0123456789";

            const chars =
                letters + digits;


            while (true) {

                let id = "U";

                const bytes =
                    crypto.getRandomValues(
                        new Uint8Array(7)
                    );


                for (let i = 0; i < 7; i++) {

                    id +=
                        chars[
                        bytes[i] % chars.length
                        ];
                }


                const digitCount =
                    [...id].filter(char =>
                        digits.includes(char)
                    ).length;


                const letterCount =
                    [...id].filter(char =>
                        letters.includes(char)
                    ).length;


                let hasTriple = false;


                for (
                    let i = 2;
                    i < id.length;
                    i++
                ) {

                    if (
                        id[i] === id[i - 1] &&
                        id[i] === id[i - 2]
                    ) {

                        hasTriple = true;
                        break;
                    }
                }


                if (
                    digitCount >= 2 &&
                    digitCount <= 4 &&
                    letterCount >= 3 &&
                    !hasTriple
                ) {

                    return id;
                }
            }
        }


        async function generateUniqueUserId() {

            while (true) {

                const userId =
                    generateUserId();


                const snap =
                    await getDoc(
                        doc(
                            db,
                            "users",
                            userId
                        )
                    );


                if (!snap.exists()) {

                    return userId;
                }
            }
        }


        /*
         * ========================================
         * 初期状態
         * ========================================
         */

        const pendingSignup =
            loadPendingSignup();


        if (
            !pendingSignup?.email ||
            !pendingSignup?.userId
        ) {

            window.location.href =
                "./signup.html";

        } else {

            document.getElementById(
                "emailLabel"
            ).innerText =
                pendingSignup.email;
        }


        function setMessage(
            text,
            type = ""
        ) {

            const message =
                document.getElementById(
                    "message"
                );

            message.className =
                `message ${type}`;

            message.innerText =
                text;
        }


        /*
         * ========================================
         * 登録
         * ========================================
         */

        window.register =
            async () => {

                const button =
                    document.getElementById(
                        "registerButton"
                    );


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const password2 =
                    document.getElementById(
                        "password2"
                    ).value;


                const restartButton =
                    document.getElementById(
                        "restartButton"
                    );


                const loginButton =
                    document.getElementById(
                        "loginButton"
                    );


                if (
                    password.length < 6
                ) {

                    setMessage(
                        "パスワードは6文字以上で入力してください",
                        "error"
                    );

                    return;
                }


                if (
                    password !== password2
                ) {

                    setMessage(
                        "パスワードが一致しません",
                        "error"
                    );

                    return;
                }


                button.disabled = true;

                setMessage(
                    "登録処理を実行しています..."
                );


                try {

                    /*
                     * --------------------------------
                     * pendingSignup確認
                     * --------------------------------
                     */

                    if (
                        !pendingSignup?.email ||
                        !pendingSignup?.userId
                    ) {

                        throw new Error(
                            "登録情報が見つかりません。最初からやり直してください。"
                        );
                    }


                    const email =
                        pendingSignup.email;

                    const userId =
                        pendingSignup.userId;


                    /*
                     * --------------------------------
                     * users取得
                     * --------------------------------
                     */

                    const userRef =
                        doc(
                            db,
                            "users",
                            userId
                        );


                    const userSnap =
                        await withTimeout(
                            getDoc(userRef)
                        );


                    if (!userSnap.exists()) {

                        throw new Error(
                            "登録情報が見つかりません。最初からやり直してください。"
                        );
                    }


                    const userData =
                        userSnap.data();


                    const verification =
                        userData.emailVerification;


                    if (!verification) {

                        throw new Error(
                            "メール認証情報が見つかりません。最初からやり直してください。"
                        );
                    }


                    /*
                     * --------------------------------
                     * メール認証確認
                     * --------------------------------
                     */

                    if (
                        !verification.verified
                    ) {

                        throw new Error(
                            "メール認証が完了していません"
                        );
                    }


                    /*
                     * --------------------------------
                     * 有効期限確認
                     * --------------------------------
                     */

                    if (
                        Date.now() >
                        verification.expiresAt
                    ) {

                        throw new Error(
                            "認証済みコードの有効期限が切れました。最初からやり直してください。"
                        );
                    }


                    /*
                     * --------------------------------
                     * Auth側の重複確認
                     * --------------------------------
                     */

                    const methods =
                        await withTimeout(
                            fetchSignInMethodsForEmail(
                                auth,
                                email
                            )
                        );


                    if (
                        methods.length > 0
                    ) {

                        throw new Error(
                            "このメールアドレスはすでに登録されています"
                        );
                    }


                    /*
                     * --------------------------------
                     * Firebase Authentication作成
                     * --------------------------------
                     */

                    const userCredential =
                        await withTimeout(
                            createUserWithEmailAndPassword(
                                auth,
                                email,
                                password
                            ),
                            "登録通信がタイムアウトしました"
                        );


                    const firebaseUser =
                        userCredential.user;


                    /*
                     * --------------------------------
                     * Firebaseプロフィール
                     * --------------------------------
                     */

                    await withTimeout(
                        updateProfile(
                            firebaseUser,
                            {
                                displayName:
                                    pendingSignup.name
                            }
                        ),
                        "プロフィール更新がタイムアウトしました"
                    );


                    /*
                     * --------------------------------
                     * users更新
                     *
                     * 仮ユーザーIDをそのまま
                     * 正式なユーザーIDとして使用
                     * --------------------------------
                     */

                    await setDoc(
                        userRef,
                        {
                            uid:
                                firebaseUser.uid,

                            name:
                                pendingSignup.name,

                            displayName:
                                pendingSignup.name,

                            email,

                            birthday: "",
                            gender: "",
                            country: "",
                            address: "",
                            phone: "",

                            emailVerification:
                                deleteField(),

                            createdAt:
                                userData.createdAt ||
                                serverTimestamp(),

                            updatedAt:
                                serverTimestamp()

                        },
                        {
                            merge: true
                        }
                    );


                    /*
                     * --------------------------------
                     * UID → UserID マッピング
                     * --------------------------------
                     */

                    await setDoc(
                        doc(
                            db,
                            "uidMap",
                            firebaseUser.uid
                        ),
                        {
                            userId
                        }
                    );


                    /*
                     * --------------------------------
                     * pendingSignup削除
                     * --------------------------------
                     */

                    clearPendingSignup();


                    setMessage(
                        "登録が完了しました",
                        "success"
                    );


                    setTimeout(() => {

                        window.location.href =
                            "./setup.html";

                    }, 800);


                } catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );


                    let message =
                        getFriendlyErrorMessage(
                            error,
                            "登録に失敗しました"
                        );


                    if (
                        error?.code ===
                        "auth/email-already-in-use"
                    ) {

                        message =
                            "このメールアドレスは既に登録されています";

                        restartButton.style.display =
                            "block";

                        loginButton.style.display =
                            "block";

                    } else if (
                        error?.code ===
                        "auth/weak-password"
                    ) {

                        message =
                            "パスワードが弱すぎます";

                        restartButton.style.display =
                            "none";

                        loginButton.style.display =
                            "none";

                    } else if (
                        error?.code ===
                        "auth/invalid-email"
                    ) {

                        message =
                            "メールアドレスの形式が正しくありません";

                        restartButton.style.display =
                            "none";

                        loginButton.style.display =
                            "none";

                    } else if (
                        error?.code ===
                        "auth/network-request-failed"
                    ) {

                        message =
                            "ネットワークエラーが発生しました";

                        restartButton.style.display =
                            "none";

                        loginButton.style.display =
                            "none";

                    } else if (
                        message.includes(
                            "有効期限が切れました"
                        ) ||
                        message.includes(
                            "確認状態が見つかりません"
                        ) ||
                        message.includes(
                            "登録情報が見つかりません"
                        ) ||
                        message.includes(
                            "メール認証情報が見つかりません"
                        ) ||
                        message.includes(
                            "最初からやり直してください"
                        )
                    ) {

                        restartButton.style.display =
                            "block";

                        loginButton.style.display =
                            "none";

                    } else {

                        restartButton.style.display =
                            "none";

                        loginButton.style.display =
                            "none";
                    }


                    setMessage(
                        message,
                        "error"
                    );

                } finally {

                    button.disabled = false;
                }
            };

    </script>

</body>

</html>
