<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード設定 | LUNAGS Account</title>
    <link rel="stylesheet" href="../../shared/normalize.css">
    <link rel="stylesheet" href="../../shared/common.css">
    <link rel="stylesheet" href="./login.css">
</head>

<body>
    <div class="box">
        <h2>パスワード設定</h2>

        <p id="emailLabel"></p>
        <input id="password" type="password" placeholder="パスワード">
        <input id="password2" type="password" placeholder="パスワード確認">
        <div id="message" class="message"></div>

        <button id="registerButton" onclick="register()">
            登録する
        </button>

        <button id="loginButton" style="display:none;background:#eef2f7;color:#333;"
            onclick="location.href='login.html'">
            ログインに戻る
        </button>

        <button id="restartButton" style="display:none;background:#eef2f7;color:#333;"
            onclick="location.href='signup.html'">
            新規登録へ戻る
        </button>

    </div>

    <script type="module">

        import {
            createUserWithEmailAndPassword,
            fetchSignInMethodsForEmail,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        import {
            deleteField,
            doc,
            getDoc,
            updateDoc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        import {
            auth,
            db,
            serverTimestamp,
            loadPendingSignup,
            clearPendingSignup,
            withTimeout,
            getFriendlyErrorMessage
        } from "../../shared/firebase-config.js";

        const pendingSignup =
            loadPendingSignup();

        /*
         * pendingSignup がない場合
         */
        if (!pendingSignup?.email || !pendingSignup?.userId) {
            window.location.href = "./signup.html";
        } else {
            document.getElementById("emailLabel").innerText = pendingSignup.email;
        }
        function setMessage(text, type = "") {
            const message = document.getElementById("message");
            message.className = `message ${type}`;
            message.innerText = text;
        }

        window.register = async () => {
            const button = document.getElementById("registerButton");
            const restartButton = document.getElementById("restartButton");
            const loginButton = document.getElementById("loginButton");
            const password = document.getElementById("password").value;
            const password2 = document.getElementById("password2").value;

            if (password.length < 6) {
                setMessage("パスワードは6文字以上で入力してください", "error");
                return;
            }

            if (password !== password2) {
                setMessage("パスワードが一致しません", "error");
                return;
            }

            button.disabled = true;
            setMessage("登録処理を実行しています...");

            try {
                /*
                 * users/{userId}
                 */
                const userRef = doc(db, "users", pendingSignup.userId);
                const snap = await withTimeout(getDoc(userRef));

                if (!snap.exists()) {
                    throw new Error("登録情報が見つかりません。最初からやり直してください。");
                }

                const data = snap.data() || {};
                const verification = data.emailVerification;

                if (!verification) {
                    throw new Error("メール認証情報が見つかりません。最初からやり直してください。");
                }

                /*
                 * メール認証済みか確認
                 */
                if (!verification.verified) {
                    throw new Error("メール認証が完了していません");
                }

                /*
                 * 認証期限確認
                 */
                if (Date.now() > verification.expiresAt) {
                    throw new Error("認証済みコードの有効期限が切れました。最初からやり直してください。");
                }

                /*
                 * メールアドレスの重複確認
                 */
                const methods = await withTimeout(fetchSignInMethodsForEmail(auth, pendingSignup.email));

                if (methods.length > 0) {
                    throw new Error("このメールアドレスはすでに登録されています");
                }

                /*
                 * Firebase Authentication
                 */
                const userCredential = await withTimeout(createUserWithEmailAndPassword(
                    auth, pendingSignup.email, password), "登録通信がタイムアウトしました");

                /*
                 * Firebase Authプロフィール
                 */
                await withTimeout(updateProfile(
                    userCredential.user, { displayName: pendingSignup.name }),
                    "プロフィール更新がタイムアウトしました");

                const uid = userCredential.user.uid;

                /*
                 * users/{userId} を完成させる
                 *
                 * emailVerification は
                 * 登録完了後に削除する。
                 */
                await withTimeout(updateDoc(
                    userRef,
                    {
                        uid,
                        userId: pendingSignup.userId,
                        name: pendingSignup.name,
                        displayName: pendingSignup.name,
                        email: pendingSignup.email,
                        birthday: "",
                        gender: "",
                        country: "",
                        address: "",
                        phone: "",
                        status: "active",
                        emailVerification: deleteField(),
                        updatedAt: serverTimestamp()
                    }
                )
                );

                /*
                 * Firebase UID → LUNAGS User ID
                 */
                await withTimeout(
                    setDoc(
                        doc(db, "uidMap", uid), {
                        userId: pendingSignup.userId,
                        updatedAt: serverTimestamp()
                    }
                    )
                );

                /*
                 * 登録途中情報を削除
                 */
                clearPendingSignup();

                setMessage("登録が完了しました", "success");

                setTimeout(() => {
                    window.location.href = "./setup.html";
                }, 800);

            } catch (error) {
                console.error(error);

                let message = getFriendlyErrorMessage(error, "登録に失敗しました");

                if (error.code === "auth/email-already-in-use") {
                    message = "このメールアドレスは既に登録されています";
                    restartButton.style.display = "block";
                    loginButton.style.display = "block";
                } else if (error.code === "auth/weak-password"
                ) {
                    message = "パスワードが弱すぎます";
                    restartButton.style.display = "none";
                    loginButton.style.display = "none";
                } else if (
                    error.code ===
                    "auth/invalid-email"
                ) {
                    message = "メールアドレスの形式が正しくありません";
                    restartButton.style.display = "none";
                    loginButton.style.display = "none";
                } else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {
                    message = "ネットワークエラーが発生しました";
                    restartButton.style.display = "none";
                    loginButton.style.display = "none";

                } else if (
                    message.includes("有効期限が切れました") ||
                    message.includes("登録情報が見つかりません") ||
                    message.includes("認証情報が見つかりません") ||
                    message.includes("メール認証が完了していません")
                ) {
                    restartButton.style.display = "block";
                    loginButton.style.display = "none";
                } else {
                    restartButton.style.display = "none";
                    loginButton.style.display = "none";
                }
                setMessage(message, "error");

            } finally {
                button.disabled = false;
            }
        };

    </script>

</body>

</html>
