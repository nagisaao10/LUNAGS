<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | LUNAGS Account</title>
    <link rel="stylesheet" href="../../shared/normalize.css">
    <link rel="stylesheet" href="../../shared/common.css">
    <link rel="stylesheet" href="./login.css">
</head>

<body>

    <div class="box">
        <h2>ログイン</h2>

        <button class="secondary" onclick="googleLogin()">
            Googleでログイン
        </button>
        <input id="email" type="email" placeholder="メールアドレス" autocomplete="email">
        <input id="password" type="password" placeholder="パスワード" autocomplete="current-password">
        <div id="message" class="message"></div>
        <button id="loginButton" onclick="login()">
            ログイン
        </button>
        <button class="secondary" onclick="location.href='./signup.html'">
            新規登録
        </button>
    </div>

    <script type="module">

        import { auth } from "../../shared/firebase-config.js";

        import {
            setPersistence,
            browserSessionPersistence,
            signInWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup,
            onAuthStateChanged,
            getAdditionalUserInfo
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        await setPersistence(
            auth,
            browserSessionPersistence
        );

        let isGoogleProcessing = false;

        onAuthStateChanged(auth, (user) => {
            if (user && !isGoogleProcessing) {
                window.location.href = "../../system/launcher.html";
            }
        });

        function setMessage(text, type = "") {
            const message = document.getElementById("message");

            message.className = `message ${type}`;
            message.innerText = text;
        }

        // ========================================
        // ログイン処理
        // ========================================

        window.login = async () => {

            const button = document.getElementById("loginButton");
            const email = document.getElementById("email").value.trim();
            const enteredPassword = document.getElementById("password").value;

            // ----------------------------------------
            // 入力チェック
            // ----------------------------------------

            if (!email) {
                setMessage(
                    "メールアドレスを入力してください。",
                    "error"
                );
                return;
            }

            if (!enteredPassword) {
                setMessage(
                    "パスワードを入力してください。",
                    "error"
                );
                return;
            }

            button.disabled = true;

            setMessage("ログインしています...");

            // ========================================
            // 通常ログイン
            // ========================================

            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    enteredPassword
                );

                setMessage("ログイン成功", "success");

                setTimeout(() => {
                    window.location.href = "../../system/launcher.html";
                }, 1000);

            } catch (err) {

                console.error("Login error:", err);

                setMessage(getLoginErrorMessage(err), "error");

            } finally {

                button.disabled = false;
            }
        };

        // ========================================
        // Firebase Authエラーメッセージ
        // ========================================

        function getLoginErrorMessage(err) {
            const code = String(err?.code || "");
            const msg = String(err?.message || "");

            // アカウント無効化
            if (code === "auth/user-disabled" || msg.includes("auth/user-disabled")) {
                return "このアカウントは無効です。管理者に連絡してアカウントの無効化を解除してもらってください。";
            }

            // 認証情報不一致・ユーザー見つからない・パスワード誤り
            if (
                code === "auth/invalid-credential" ||
                code === "auth/invalid-login-credentials" ||
                code === "auth/user-not-found" ||
                code === "auth/wrong-password" ||
                code === "auth/invalid-email" ||
                msg.includes("auth/invalid-credential") ||
                msg.includes("auth/invalid-login-credentials") ||
                msg.includes("auth/user-not-found") ||
                msg.includes("auth/wrong-password") ||
                msg.includes("auth/invalid-email")
            ) {
                return "メールアドレスまたはパスワードが正しくありません。";
            }

            // リクエスト過多
            if (code === "auth/too-many-requests" || msg.includes("auth/too-many-requests")) {
                return "ログイン試行が多すぎます。しばらく待ってから再試行してください。";
            }

            // ネットワークエラー
            if (code === "auth/network-request-failed" || msg.includes("auth/network-request-failed")) {
                return "ネットワークエラーが発生しました。通信環境をご確認ください。";
            }

            // ポップアップキャンセル
            if (code === "auth/popup-closed-by-user" || msg.includes("auth/popup-closed-by-user")) {
                return "ログインがキャンセルされました。";
            }

            return "ログインに失敗しました。メールアドレスとパスワードをお確かめください。";
        }

        // ========================================
        // Googleログイン
        // ========================================

        window.googleLogin = () => {

            isGoogleProcessing = true;

            const provider =
                new GoogleAuthProvider();

            signInWithPopup(
                auth,
                provider
            )
                .then((result) => {

                    const additionalUserInfo =
                        getAdditionalUserInfo(result);

                    // ----------------------------------------
                    // 新規ユーザー
                    // ----------------------------------------

                    if (
                        additionalUserInfo &&
                        additionalUserInfo.isNewUser
                    ) {

                        return result.user.delete()
                            .then(() => {

                                setMessage(
                                    "アカウントが登録されていません。先に新規登録をしてください。",
                                    "error"
                                );

                                isGoogleProcessing = false;
                            })
                            .catch((deleteErr) => {

                                console.error(
                                    deleteErr
                                );

                                setMessage(
                                    "エラーが発生しました。",
                                    "error"
                                );

                                isGoogleProcessing = false;
                            });
                    }

                    // ----------------------------------------
                    // 登録済みユーザー
                    // ----------------------------------------

                    setMessage("Googleでログイン成功", "success");

                    setTimeout(() => {
                        window.location.href = "../../system/launcher.html";
                    }, 1000);
                })
                .catch(err => {

                    console.error("Google login error:", err);
                    setMessage(getLoginErrorMessage(err), "error");

                    isGoogleProcessing = false;
                });
        };

    </script>

</body>

</html>
