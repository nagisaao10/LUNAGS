<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>システムログ | LUNAGS Admin</title>
    <link rel="stylesheet" href="../shared/normalize.css">
    <link rel="stylesheet" href="../shared/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./admin.css">
</head>

<body>
    <button class="hamburger" id="hamburgerBtn" aria-label="メニュー">
        <i class="fas fa-bars"></i>
    </button>

    <div class="page">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__brand">
                <img src="../images/logo_LUNAGS.png" alt="LUNAGS" class="logo-lunags">
                <div class="sidebar__brand-divider"></div>
                <span class="sidebar__brand-subtitle">ADMIN ACCOUNT</span>
            </div>

            <nav class="menu-list" aria-label="管理者メニュー">
                <a href="../system/launcher.html" class="menu">
                    <i class="fa-solid fa-table-cells-large"></i>
                    <span>ランチャー</span>
                </a>

                <div class="sidebar__divider" style="height:1px; margin:4px 8px; background:rgba(255,255,255,0.1);"></div>

                <div class="sidebar__section-label"
                    style="padding:14px 8px 4px; color:rgba(238,245,255,0.48); font-size:10px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase;">
                    管理者専用
                </div>

                <a href="./admin.html" class="menu">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>管理者</span>
                </a>

                <a href="./users.html" class="menu">
                    <i class="fa-solid fa-users-gear"></i>
                    <span>ユーザー管理</span>
                </a>

                <a href="./logs.html" class="menu active">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <span>システムログ</span>
                </a>

                <a href="./analytics.html" class="menu">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>分析</span>
                </a>
            </nav>

            <div class="sidebar__footer">
                <button class="btn" id="refreshBtn" type="button">
                    <i class="fa-solid fa-rotate"></i>
                    <span>再読み込み</span>
                </button>
                <button class="btn logout-btn" id="logoutBtn" type="button">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>ログアウト</span>
                </button>
            </div>
        </aside>

        <main class="main fade-in">
            <header class="topbar">
                <div>
                    <h1 class="topbar__title">LOGS</h1>
                    <div class="topbar__sub">管理者操作と権限関連イベント</div>
                </div>
                <div class="status-strip">
                    <span class="pill pill--muted" id="statusPill">確認中</span>
                </div>
            </header>

            <section class="card hidden" id="accessDenied">
                <div class="card__head">
                    <h2><i class="fa-solid fa-triangle-exclamation"></i> アクセスできません</h2>
                </div>
                <p class="error">このページは管理者アカウント専用です。</p>
                <a class="btn btn-primary" href="../system/launcher.html">ランチャーへ戻る</a>
            </section>

            <div id="content" class="hidden">
                <section class="toolbar">
                    <label class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input id="searchInput" type="search" placeholder="メールアドレス・イベント・対象・結果で検索" autocomplete="off">
                    </label>
                    <span class="pill pill--muted" id="countPill">0件</span>
                </section>

                <section class="card">
                    <div class="card__head">
                        <h2><i class="fa-solid fa-clipboard-list"></i> 監査ログ</h2>
                    </div>
                    <div class="table-wrap">
                        <table class="data-table log-table">
                            <thead>
                                <tr>
                                    <th>日時</th>
                                    <th>イベント</th>
                                    <th>メールアドレス</th>
                                    <th>対象</th>
                                    <th>結果</th>
                                    <th>ソース</th>
                                </tr>
                            </thead>
                            <tbody id="logsBody"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth, FUNCTIONS_ENDPOINT } from "../shared/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        const $ = (id) => document.getElementById(id);
        const state = { logs: [] };

        function formatDate(value) {
            if (!value) return "-";
            const date = typeof value === "number" ? new Date(value) : new Date(value);
            if (Number.isNaN(date.getTime())) return "-";
            return date.toLocaleString("ja-JP");
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        async function request(path) {
            const user = auth.currentUser;
            if (!user) throw new Error("ログインが必要です");
            const token = await user.getIdToken();
            const response = await fetch(`${FUNCTIONS_ENDPOINT}${path}`, {
                method: "GET",
                headers: { Authorization: `Bearer ${token}` }
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.ok) {
                const error = new Error(data.error || "通信に失敗しました");
                error.status = response.status;
                throw error;
            }
            return data;
        }

        function setAccessDenied() {
            const pill = $("statusPill");
            pill.textContent = "拒否";
            pill.className = "pill pill--danger";
            $("accessDenied").classList.remove("hidden");
            $("content").classList.add("hidden");
        }

        function resolveActorEmail(log) {
            if (log.type === "管理者アカウント") {
                const isInitial = log.actorEmail === "初期設定" ||
                    log.actorName === "初期設定" ||
                    log.actorUid === "initial_setup" ||
                    log.details?.isInitialSetup ||
                    log.details?.approvedByEmail === "初期設定";
                return isInitial ? "初期設定" : "admin";
            }
            if (log.type === "降格申請") {
                return log.actorEmail || "admin";
            }
            return log.actorEmail || log.actorName || "-";
        }

        function renderLogs() {
            const keyword = $("searchInput").value.trim().toLowerCase();
            const logs = state.logs.filter((log) => {
                const displayActor = resolveActorEmail(log);
                const haystack = [
                    log.type,
                    displayActor,
                    log.actorEmail,
                    log.actorName,
                    log.target,
                    log.result,
                    log.source
                ].join(" ").toLowerCase();
                return !keyword || haystack.includes(keyword);
            });

            $("countPill").textContent = `${logs.length}件`;
            $("logsBody").innerHTML = logs.length
                ? logs.map((log) => {
                    const actorDisplay = resolveActorEmail(log);
                    const resultText = log.result || "completed";
                    return `
                    <tr>
                        <td style="white-space:nowrap;">${formatDate(log.occurredAt)}</td>
                        <td><span class="log-type"><i class="fa-solid fa-circle-dot"></i>${escapeHtml(log.type)}</span></td>
                        <td><span class="cell-email" title="${escapeHtml(actorDisplay)}">${escapeHtml(actorDisplay)}</span></td>
                        <td><span class="cell-email" title="${escapeHtml(log.target || "-")}">${escapeHtml(log.target || "-")}</span></td>
                        <td><span class="pill ${resultText === "completed" ? "pill--mode" : "pill--muted"}" style="font-size:11px;">${escapeHtml(resultText)}</span></td>
                        <td><span class="pill pill--muted" style="font-size:11px;">${escapeHtml(log.source)}</span></td>
                    </tr>
                    `;
                }).join("")
                : `<tr><td colspan="6"><div class="empty-state">ログはありません。</div></td></tr>`;
        }

        async function loadLogs() {
            const pill = $("statusPill");
            pill.textContent = "読み込み中";
            pill.className = "pill pill--muted";

            const data = await request("/admin-logs");
            state.logs = data.logs || [];
            renderLogs();

            pill.textContent = "管理者アカウント";
            pill.className = "pill pill--admin";
            $("accessDenied").classList.add("hidden");
            $("content").classList.remove("hidden");
        }

        function handleError(error) {
            console.error(error);
            if (error.status === 401 || error.status === 403) {
                setAccessDenied();
                return;
            }
            const pill = $("statusPill");
            pill.textContent = "エラー";
            pill.className = "pill pill--danger";
            alert(error.message);
        }

        $("hamburgerBtn").addEventListener("click", () => {
            $("sidebar").classList.toggle("open");
        });
        $("refreshBtn").addEventListener("click", () => loadLogs().catch(handleError));
        $("logoutBtn").addEventListener("click", async () => {
            if (confirm("ログアウトしますか？")) {
                try {
                    await signOut(auth);
                    window.location.href = "../account/login/login.html";
                } catch (error) {
                    console.error("ログアウトに失敗しました:", error);
                    alert("ログアウトに失敗しました: " + error.message);
                }
            }
        });
        $("searchInput").addEventListener("input", renderLogs);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "../account/login/login.html";
                return;
            }
            loadLogs().catch(handleError);
        });
    </script>
</body>

</html>
