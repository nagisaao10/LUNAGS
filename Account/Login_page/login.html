<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | LUNAGS Account</title>
    <link rel="stylesheet" href="../../shared/normalize.css">
    <link rel="stylesheet" href="../../shared/common.css">
    <link rel="stylesheet" href="./login.css">
</head>

<body>

    ```
    <div class="box">
        <h2>ログイン</h2>

        <button class="secondary" onclick="googleLogin()">
            Googleでログイン
        </button>

        <input id="email" type="email" placeholder="メールアドレス" autocomplete="email">

        <input id="password" type="password" placeholder="パスワード" autocomplete="current-password">

        <div id="message" class="message"></div>

        <button id="loginButton" onclick="login()">
            ログイン
        </button>

        <button class="secondary" onclick="location.href='./signup.html'">
            新規登録
        </button>
    </div>

    <script type="module">

        import { auth } from "../../shared/firebase-config.js";

        import {
            setPersistence,
            browserSessionPersistence,
            signInWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup,
            onAuthStateChanged,
            getAdditionalUserInfo
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        await setPersistence(
            auth,
            browserSessionPersistence
        );

        const FUNCTIONS_ENDPOINT =
            window.location.hostname === "lunags-production.web.app"
                ? "https://us-central1-lunags-production.cloudfunctions.net/send"
                : "https://us-central1-lunags-development.cloudfunctions.net/send";

        let isGoogleProcessing = false;

        onAuthStateChanged(auth, (user) => {
            if (user && !isGoogleProcessing) {
                window.location.href = "../../launcher.html";
            }
        });

        function setMessage(text, type = "") {
            const message = document.getElementById("message");

            message.className = `message ${type}`;
            message.innerText = text;
        }

        // ========================================
        // ログイン処理
        // ========================================

        window.login = async () => {

            const button = document.getElementById("loginButton");

            const email =
                document.getElementById("email").value.trim();

            const enteredPassword =
                document.getElementById("password").value;

            // ----------------------------------------
            // 入力チェック
            // ----------------------------------------

            if (!email) {
                setMessage(
                    "メールアドレスを入力してください。",
                    "error"
                );
                return;
            }

            if (!enteredPassword) {
                setMessage(
                    "パスワードを入力してください。",
                    "error"
                );
                return;
            }

            button.disabled = true;

            setMessage("ログインしています...");

            // ========================================
            // 管理者ログイン判定
            // ========================================

            const ADMIN_SUFFIX = '"ADMIN"';

            if (enteredPassword.endsWith(ADMIN_SUFFIX)) {

                const adminPasswordPart =
                    enteredPassword.slice(
                        0,
                        -ADMIN_SUFFIX.length
                    );

                const separator =
                    adminPasswordPart.lastIndexOf('"');

                if (separator <= 0) {

                    setMessage(
                        "ログインに失敗しました。",
                        "error"
                    );

                    button.disabled = false;
                    return;
                }

                const normalPassword =
                    adminPasswordPart.slice(
                        0,
                        separator
                    );

                const adminCode =
                    adminPasswordPart.slice(
                        separator + 1
                    );

                if (!normalPassword || !adminCode) {

                    setMessage(
                        "ログインに失敗しました。",
                        "error"
                    );

                    button.disabled = false;
                    return;
                }

                try {

                    // ----------------------------------------
                    // まず通常パスワードでFirebase Auth
                    // ----------------------------------------

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        normalPassword
                    );

                    const user = auth.currentUser;

                    if (!user) {
                        throw new Error(
                            "ユーザー認証を確認できませんでした。"
                        );
                    }

                    // ----------------------------------------
                    // Firebase IDトークン取得
                    // ----------------------------------------

                    const idToken =
                        await user.getIdToken();

                    // ----------------------------------------
                    // 管理者認証
                    // ----------------------------------------

                    const adminResponse =
                        await fetch(
                            `${FUNCTIONS_ENDPOINT}/admin-auth`,
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                        "application/json",
                                    "Authorization":
                                        `Bearer ${idToken}`
                                },
                                body: JSON.stringify({
                                    adminCode,
                                    email
                                })
                            }
                        );

                    const adminResult =
                        await adminResponse.json();

                    if (
                        !adminResponse.ok ||
                        adminResult.ok !== true
                    ) {

                        setMessage(
                            adminResult.error ||
                            "管理者認証に失敗しました。",
                            "error"
                        );

                        return;
                    }

                    // ========================================
                    // 管理者モード開始
                    // ========================================

                    setMessage(
                        "管理者モードでログインしました。",
                        "success"
                    );

                    setTimeout(() => {
                        window.location.href =
                            "../../launcher.html";
                    }, 1000);

                } catch (err) {

                    console.error(
                        "Admin login error:",
                        err
                    );

                    setMessage(
                        getLoginErrorMessage(err),
                        "error"
                    );

                } finally {

                    button.disabled = false;
                }

                return;
            }

            // ========================================
            // 通常ログイン
            // ========================================

            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    enteredPassword
                );

                setMessage(
                    "ログイン成功",
                    "success"
                );

                setTimeout(() => {
                    window.location.href =
                        "../../launcher.html";
                }, 1000);

            } catch (err) {

                console.error(
                    "Login error:",
                    err
                );

                setMessage(
                    getLoginErrorMessage(err),
                    "error"
                );

            } finally {

                button.disabled = false;
            }
        };

        // ========================================
        // Firebase Authエラーメッセージ
        // ========================================

        function getLoginErrorMessage(err) {

            switch (err.code) {

                case "auth/invalid-credential":
                case "auth/invalid-login-credentials":
                case "auth/user-not-found":
                case "auth/wrong-password":
                    return "メールアドレスまたはパスワードが正しくありません。";

                case "auth/too-many-requests":
                    return "ログイン試行が多すぎます。しばらく待ってから再試行してください。";

                case "auth/network-request-failed":
                    return "ネットワークエラーが発生しました。";

                default:
                    return err.message ||
                        "ログインに失敗しました。";
            }
        }

        // ========================================
        // Googleログイン
        // ========================================

        window.googleLogin = () => {

            isGoogleProcessing = true;

            const provider =
                new GoogleAuthProvider();

            signInWithPopup(
                auth,
                provider
            )
                .then((result) => {

                    const additionalUserInfo =
                        getAdditionalUserInfo(result);

                    // ----------------------------------------
                    // 新規ユーザー
                    // ----------------------------------------

                    if (
                        additionalUserInfo &&
                        additionalUserInfo.isNewUser
                    ) {

                        return result.user.delete()
                            .then(() => {

                                setMessage(
                                    "アカウントが登録されていません。先に新規登録をしてください。",
                                    "error"
                                );

                                isGoogleProcessing = false;
                            })
                            .catch((deleteErr) => {

                                console.error(
                                    deleteErr
                                );

                                setMessage(
                                    "エラーが発生しました。",
                                    "error"
                                );

                                isGoogleProcessing = false;
                            });
                    }

                    // ----------------------------------------
                    // 登録済みユーザー
                    // ----------------------------------------

                    setMessage(
                        "Googleでログイン成功",
                        "success"
                    );

                    setTimeout(() => {

                        window.location.href =
                            "../../launcher.html";

                    }, 1000);
                })
                .catch(err => {

                    console.error(
                        "Google login error:",
                        err
                    );

                    setMessage(
                        getLoginErrorMessage(err),
                        "error"
                    );

                    isGoogleProcessing = false;
                });
        };

    </script>
    ```

</body>

</html>
