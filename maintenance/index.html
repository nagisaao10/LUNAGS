<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#73B8FD">

    <title>メンテナンス中 | LUNAGS System</title>

    <link rel="stylesheet" href="../shared/normalize.css">
    <link rel="stylesheet" href="../shared/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../system/404.css">

    <style>
        .maintenance-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 7px 12px;
            border: 1px solid var(--blue-200);
            border-radius: var(--radius);
            color: var(--blue-800);
            background: var(--surface-blue);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.06em;
        }

        .maintenance-notice {
            width: min(100%, 560px);
            margin-top: 22px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--muted);
            background: var(--surface-soft);
            font-size: 13px;
            font-weight: 600;
            line-height: 1.8;
            text-align: left;
        }

        .maintenance-reload {
            font: inherit;
            cursor: pointer;
        }

        .maintenance-reload:focus-visible {
            outline: 3px solid var(--blue-300);
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="error-layout">

        <aside class="error-rail">
            <div class="error-brand">
                <img src="../images/logo_LUNAGS.png" alt="LUNAGS">

                <div class="error-brand__divider"></div>

                <span class="error-brand__label">SYSTEM</span>
            </div>

            <nav class="error-nav" aria-label="メインメニュー">
                <a class="error-nav__link" href="../system/launcher.html">
                    <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>
                    <span>ランチャー</span>
                </a>
            </nav>
        </aside>

        <main class="error-main">

            <header class="error-topbar">
                <h1>メンテナンス中</h1>
                <p>LUNAGS System Maintenance</p>
            </header>

            <section class="error-card" aria-labelledby="maintenanceTitle">

                <div class="error-icon">
                    <i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i>
                </div>

                <div class="maintenance-status">
                    <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                    <span>SYSTEM MAINTENANCE</span>
                </div>

                <h2 class="error-title" id="maintenanceTitle">
                    メンテナンス中です
                </h2>

                <p class="error-message">
                    現在、LUNAGSの安全性と安定性を確保するため、メンテナンスを実施しています。
                    ご不便をおかけしますが、復旧までしばらくお待ちください。
                </p>

                <div class="maintenance-notice">
                    安全確認が完了するまで、一部またはすべてのサービスをご利用いただけません。
                    復旧時刻は、確認が取れるまでお知らせしていません。
                </div>

                <button class="error-link maintenance-reload" type="button" onclick="window.location.reload()">
                    <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
                    <span>ページを再読み込み</span>
                </button>

            </section>

        </main>

    </div>
</body>

</html>
