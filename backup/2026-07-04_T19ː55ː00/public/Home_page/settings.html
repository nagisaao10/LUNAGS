<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設定 - LUNAGS 管理システム</title>
    <link rel="stylesheet" href="home.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <!-- サイドバー -->
        <aside class="sidebar">
            <div class="logo-container">
                <img src="../images/logo_LUNAGS.png" alt="LUNAGS LOGO">
            </div>
            <nav class="menu-list">
                <!-- ダッシュボード (ホーム) -->
                <a href="home.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    ダッシュボード
                </a>
                <!-- カレンダー -->
                <a href="calendar.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
                    カレンダー
                </a>
                <!-- ポスト (投稿予定) -->
                <a href="posts.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    ポスト (投稿予定)
                </a>
                <!-- タスク -->
                <a href="tasks.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    タスク
                </a>
                <!-- 統計 -->
                <a href="statistics.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                    統計
                </a>
                <!-- 設定 -->
                <a href="settings.html" class="menu-item active">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    設定
                </a>
                <!-- マイページ -->
                <a href="../My_page/profile.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    マイページ
                </a>
            </nav>
            <div class="logout-btn-container">
                <button class="logout-btn" id="btn-logout">
                    <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                    ログアウト
                </button>
            </div>
        </aside>

        <!-- メインコンテンツ -->
        <main class="content">
            <!-- ヘッダーツールバー -->
            <header class="toolbar">
                <div class="page-title">設定 (Settings)</div>
                <div class="header-right">
                    <!-- 通知ベル -->
                    <div class="bell-container" id="bell-container">
                        <svg class="bell-icon" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                        <div class="bell-badge" id="bell-badge"></div>
                    </div>
                </div>
            </header>

            <!-- メインパネル -->
            <div class="main-panel">
                <div class="form-container">
                    <h2 style="font-size: 18px; margin-bottom: 24px; color: var(--text-primary);">システム設定</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>テーマ設定</label>
                            <select>
                                <option>LUNAGS Glass (Light Blue)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>通知設定</label>
                            <select>
                                <option>すべての通知をオン</option>
                                <option>メンションのみ</option>
                                <option>オフ</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>カレンダーの週の始まり</label>
                            <select>
                                <option>日曜日</option>
                                <option>月曜日</option>
                            </select>
                        </div>
                        <div class="form-group" style="grid-column: span 3;">
                            <label>メール通知アドレス</label>
                            <input type="email" placeholder="example@lunags.com">
                        </div>
                    </div>
                    <div class="form-actions" style="margin-top: 24px;">
                        <button class="btn btn-primary" onclick="alert('設定を保存しました（モックアップ）')">設定を保存する</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase & Logic (モックアップ用最小限) -->
    <script type="module">
        import { auth } from "../firebase-config.js";
        import { signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        // ログアウト処理
        const btnLogout = document.getElementById('btn-logout');
        if (btnLogout) {
            btnLogout.addEventListener('click', async () => {
                if (confirm("ログアウトしますか？")) {
                    try {
                        await signOut(auth);
                        window.location.href = "../Login_page/login.html";
                    } catch (error) {
                        console.error("ログアウトエラー:", error);
                        alert("ログアウトに失敗しました。");
                    }
                }
            });
        }
    </script>
</body>
</html>
