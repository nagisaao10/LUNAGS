<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダッシュボード - LUNAGS 管理システム</title>
    <link rel="stylesheet" href="home.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <!-- サイドバー -->
        <aside class="sidebar">
            <div class="logo-container">
                <img src="../images/logo_LUNAGS.png" alt="LUNAGS LOGO">
            </div>
            <nav class="menu-list">
                <!-- ダッシュボード (ホーム) -->
                <a href="home.html" class="menu-item active">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    ダッシュボード
                </a>
                <!-- カレンダー -->
                <a href="calendar.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
                    カレンダー
                </a>
                <!-- ポスト (投稿予定) -->

                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    ポスト (投稿予定)
                </a>
                <!-- タスク -->
                <a href="tasks.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    タスク
                </a>
                <!-- 統計 -->
                <a href="statistics.html" class="menu-item">

                    統計
                </a>
                <!-- 設定 -->
                <a href="settings.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    設定
                </a>
                <!-- マイページ -->
                <a href="../My_page/profile.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    マイページ
                </a>
            </nav>
            <div class="logout-btn-container">
                <button class="logout-btn" id="btn-logout">
                    <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                    ログアウト
                </button>
            </div>
        </aside>

        <!-- メインコンテンツ -->
        <main class="content">
            <!-- ヘッダーツールバー -->
            <header class="toolbar">
                <div class="page-title">ダッシュボード</div>
                <div class="header-right">
                    <!-- 予定検索 -->
                    <div class="search-container">
                        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <input type="text" class="search-input" id="search-input" placeholder="予定を検索...">
                    </div>
                    
                    <!-- 通知ベル -->
                    <div class="bell-container" id="bell-container">
                        <svg class="bell-icon" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                        <div class="bell-badge" id="bell-badge"></div>
                    </div>
                    
                    <!-- Firestore 接続ステータス -->
                    <div class="status-indicator online" id="status-indicator">
                        <span class="status-dot"></span>
                        <span id="status-text">Firestore オンライン</span>
                    </div>
                </div>
            </header>

            <!-- 通知ドロップダウン -->
            <div class="notification-dropdown" id="notification-dropdown">
                <div class="notification-header">
                    <span>通知一覧</span>
                    <span class="clear-notifications" id="btn-clear-notifications">すべて既読にする</span>
                </div>
                <div class="notification-list" id="notification-list">
                    <!-- JSで動的に追加されます -->
                    <div class="notification-empty">通知はありません</div>
                </div>
            </div>

            <!-- メインパネル -->
            <div class="main-panel">
                <!-- 検索結果パネル (検索時のみ表示) -->
                <section class="search-results-panel" id="search-results-panel">
                    <div class="search-results-title">
                        <span>検索結果</span>
                        <span class="close-search" id="btn-close-search">閉じる</span>
                    </div>
                    <div class="table-container">
                        <table class="responsive-table">
                            <thead>
                                <tr>
                                    <th>区分</th>
                                    <th>日付</th>
                                    <th>時間/期限</th>
                                    <th>担当者</th>
                                    <th>タイトル</th>
                                    <th>ステータス</th>
                                </tr>
                            </thead>
                            <tbody id="search-results-body">
                                <!-- 検索結果がここに入ります -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- ダッシュボードカード -->
                <div class="dashboard-grid">
                    <!-- 今日の達成率カード -->
                    <div class="dashboard-card">
                        <div class="dashboard-card-title">本日の予定達成率</div>
                        <div class="progress-ring-container">
                            <div class="progress-ring">
                                <svg>
                                    <circle class="progress-ring-circle-bg" cx="60" cy="60" r="50"></circle>
                                    <circle class="progress-ring-circle" id="progress-circle" cx="60" cy="60" r="50"></circle>
                                </svg>
                                <div class="progress-ring-text" id="progress-text">0%</div>
                            </div>
                        </div>
                        <div class="dashboard-card-sub" id="progress-sub" style="text-align: center;">完了 0 / 総予定 0 件</div>
                    </div>

                    <!-- 本日の総予定数 -->
                    <div class="dashboard-card" style="display: flex; flex-direction: column; justify-content: center;">
                        <div class="dashboard-card-title">本日の予定数</div>
                        <div class="dashboard-card-value" id="today-total-count">0 件</div>
                        <div class="dashboard-card-sub" id="today-details-sub">投稿: 0 件 | タスク: 0 件</div>
                    </div>

                    <!-- 今週の残予定数 -->
                    <div class="dashboard-card" style="display: flex; flex-direction: column; justify-content: center;">
                        <div class="dashboard-card-title">今週の残り未完了タスク</div>
                        <div class="dashboard-card-value" id="week-remaining-tasks">0 件</div>
                        <div class="dashboard-card-sub" id="week-details-sub">投稿未完了: 0 件 | タスク未完了: 0 件</div>
                    </div>
                </div>

                <!-- 今日の予定リストテーブル -->
                <section>
                    <div class="dashboard-card-title" style="font-size: 16px; margin-bottom: 16px; color: var(--text-primary);">本日の予定一覧</div>
                    <div class="table-container">
                        <table class="responsive-table">
                            <thead>
                                <tr>
                                    <th style="width: 120px;">区分</th>
                                    <th style="width: 100px;">時刻</th>
                                    <th style="width: 120px;">担当者</th>
                                    <th>予定タイトル</th>
                                    <th style="width: 120px; text-align: center;">完了</th>
                                    <th style="width: 120px; text-align: center;">サムネ完了</th>
                                </tr>
                            </thead>
                            <tbody id="today-schedule-body">
                                <tr>
                                    <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 32px;">本日の予定はありません</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- トースト通知コンテナ -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Firebase & JavaScript Logic -->
    <script type="module">
        import { auth, db } from "../firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { collection, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        // DOM Elements
        const statusIndicator = document.getElementById("status-indicator");
        const statusText = document.getElementById("status-text");
        const progressCircle = document.getElementById("progress-circle");
        const progressText = document.getElementById("progress-text");
        const progressSub = document.getElementById("progress-sub");
        const todayTotalCount = document.getElementById("today-total-count");
        const todayDetailsSub = document.getElementById("today-details-sub");
        const weekRemainingTasks = document.getElementById("week-remaining-tasks");
        const weekDetailsSub = document.getElementById("week-details-sub");
        const todayScheduleBody = document.getElementById("today-schedule-body");
        
        const searchInput = document.getElementById("search-input");
        const searchResultsPanel = document.getElementById("search-results-panel");
        const searchResultsBody = document.getElementById("search-results-body");
        const btnCloseSearch = document.getElementById("btn-close-search");

        const bellContainer = document.getElementById("bell-container");
        const bellBadge = document.getElementById("bell-badge");
        const notificationDropdown = document.getElementById("notification-dropdown");
        const notificationList = document.getElementById("notification-list");
        const btnClearNotifications = document.getElementById("btn-clear-notifications");
        const toastContainer = document.getElementById("toast-container");
        const btnLogout = document.getElementById("btn-logout");

        // Application State
        let currentUser = null;
        let isOnline = true;
        let dbPosts = [];
        let dbTasks = [];
        let dbNotifications = [];
        let dbMembers = [];
        let todayDateStr = "";

        // 日付を日本時間基準の「YYYY-MM-DD」形式で取得
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        todayDateStr = `${y}-${m}-${d}`;

        // ログアウト処理
        btnLogout.addEventListener("click", async () => {
            if (confirm("ログアウトしますか？")) {
                try {
                    await signOut(auth);
                    window.location.href = "../Login_page/login.html";
                } catch (error) {
                    console.error("ログアウト失敗:", error);
                }
            }
        });

        // ログイン監視
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                console.log("Logged in user:", user.email);
                
                // データのリアルタイムロードを開始
                initDataSync();
            } else {
                window.location.href = "../Login_page/login.html";
            }
        });

        // Firebase / LocalStorage 連携初期化
        async function initDataSync() {
            try {
                // 1. 接続確認
                const testRef = doc(db, "system", "health");
                await getDoc(testRef); // 通信チェック
                setOnlineStatus(true);
                
                // 2. リアルタイム監視 (Posts)
                onSnapshot(collection(db, "posts"), (snapshot) => {
                    dbPosts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    localStorage.setItem("lunags_posts", JSON.stringify(dbPosts));
                    updateUI();
                }, (error) => {
                    console.warn("Posts Firestore error:", error);
                    fallbackToLocal();
                });

                // 3. リアルタイム監視 (Tasks)
                onSnapshot(collection(db, "tasks"), (snapshot) => {
                    dbTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    localStorage.setItem("lunags_tasks", JSON.stringify(dbTasks));
                    updateUI();
                }, (error) => {
                    console.warn("Tasks Firestore error:", error);
                    fallbackToLocal();
                });

                // 4. リアルタイム監視 (Notifications)
                // 現在ログイン中のユーザー宛ての通知を監視
                onSnapshot(collection(db, "notifications"), (snapshot) => {
                    const allNotifs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    // 宛先ユーザーが一致するもの（または宛先が 'all' のもの）をフィルタ
                    dbNotifications = allNotifs.filter(n => n.recipientEmail === currentUser.email || n.recipientEmail === "all")
                                               .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    
                    localStorage.setItem("lunags_notifications", JSON.stringify(dbNotifications));
                    updateNotificationsUI();
                    
                    // 新しい未読通知があればトーストを出す
                    snapshot.docChanges().forEach(change => {
                        if (change.type === "added") {
                            const notif = change.doc.data();
                            if ((notif.recipientEmail === currentUser.email || notif.recipientEmail === "all") && !notif.read) {
                                // 作成から1分以内のものだけ表示
                                const createdTime = notif.createdAt?.toDate() || new Date();
                                if (new Date() - createdTime < 60000) {
                                    showToast(notif.message, "info");
                                }
                            }
                        }
                    });
                });

                // 5. メンバー情報
                onSnapshot(collection(db, "users"), (snapshot) => {
                    dbMembers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    localStorage.setItem("lunags_members", JSON.stringify(dbMembers));
                });

            } catch (err) {
                console.error("Firestore sync failed, entering local mode:", err);
                fallbackToLocal();
            }
        }

        // オンライン・オフラインステータス切り替え
        function setOnlineStatus(online) {
            isOnline = online;
            if (online) {
                statusIndicator.className = "status-indicator online";
                statusText.textContent = "Firestore オンライン";
            } else {
                statusIndicator.className = "status-indicator offline";
                statusText.textContent = "ローカルモード";
            }
        }

        // ローカルストレージからのフォールバック
        function fallbackToLocal() {
            setOnlineStatus(false);
            
            // ローカルストレージからロード
            dbPosts = JSON.parse(localStorage.getItem("lunags_posts")) || getDummyPosts();
            dbTasks = JSON.parse(localStorage.getItem("lunags_tasks")) || getDummyTasks();
            dbNotifications = JSON.parse(localStorage.getItem("lunags_notifications")) || [];
            dbMembers = JSON.parse(localStorage.getItem("lunags_members")) || [];
            
            updateUI();
            updateNotificationsUI();
            
            // ローカルで変更監視のダミーをセット
            window.addEventListener("storage", (e) => {
                if (e.key === "lunags_posts") {
                    dbPosts = JSON.parse(e.newValue) || [];
                    updateUI();
                }
                if (e.key === "lunags_tasks") {
                    dbTasks = JSON.parse(e.newValue) || [];
                    updateUI();
                }
                if (e.key === "lunags_notifications") {
                    dbNotifications = JSON.parse(e.newValue) || [];
                    updateNotificationsUI();
                }
            });
        }

        // ダミーデータ定義
        function getDummyPosts() {
            return [
                { id: "p1", title: "【ゲーム配信】マインクラフト参加型", postDate: todayDateStr, timeSlot: "19:00", memberName: "なぎさ", isDone: false, thumbnailDone: false },
                { id: "p2", title: "ショート動画投稿: 歌ってみた切り抜き", postDate: todayDateStr, timeSlot: "12:00", memberName: "なぎさ", isDone: true, thumbnailDone: true },
                { id: "p3", title: "雑談配信: 最近のニュースについて", postDate: todayDateStr, timeSlot: "21:00", memberName: "メンバーA", isDone: false, thumbnailDone: true }
            ];
        }

        function getDummyTasks() {
            return [
                { id: "t1", taskName: "サムネイラストの発注確認", dueDate: todayDateStr, memberName: "なぎさ", status: "未完了" },
                { id: "t2", taskName: "新企画の資料まとめ", dueDate: todayDateStr, memberName: "メンバーA", status: "完了" },
                { id: "t3", taskName: "配信スケジュール画像の作成", dueDate: todayDateStr, memberName: "メンバーB", status: "未完了" }
            ];
        }

        // UI全体の更新
        function updateUI() {
            // 1. 今日の予定抽出
            const todayPosts = dbPosts.filter(p => p.postDate === todayDateStr);
            const todayTasks = dbTasks.filter(t => t.dueDate === todayDateStr);

            // 2. 本日の予定リスト描画
            todayScheduleBody.innerHTML = "";
            let todayTotal = todayPosts.length + todayTasks.length;
            let todayDoneCount = 0;

            if (todayTotal === 0) {
                todayScheduleBody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 32px;">本日の予定はありません</td>
                    </tr>
                `;
            } else {
                // ポストのレンダリング
                todayPosts.forEach(post => {
                    if (post.isDone) todayDoneCount++;
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td><span class="badge badge-success" style="background-color: var(--color-primary-light); color: var(--color-primary);">ポスト</span></td>
                        <td>${post.timeSlot || "-"}</td>
                        <td>${post.memberName || "-"}</td>
                        <td style="${post.isDone ? 'text-decoration: line-through; opacity: 0.6;' : ''}">${post.title}</td>
                        <td style="text-align: center;">
                            <label class="toggle-switch">
                                <input type="checkbox" class="chk-post-done" data-id="${post.id}" ${post.isDone ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        </td>
                        <td style="text-align: center;">
                            <label class="toggle-switch">
                                <input type="checkbox" class="chk-post-thumb" data-id="${post.id}" ${post.thumbnailDone ? 'checked' : ''}>
                                <span class="slider" style="background-color: ${post.thumbnailDone ? 'var(--color-success)' : ''};"></span>
                            </label>
                        </td>
                    `;
                    todayScheduleBody.appendChild(tr);
                });

                // タスクのレンダリング
                todayTasks.forEach(task => {
                    const isDone = task.status === "完了";
                    if (isDone) todayDoneCount++;
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td><span class="badge badge-success">タスク</span></td>
                        <td>終日</td>
                        <td>${task.memberName || "-"}</td>
                        <td style="${isDone ? 'text-decoration: line-through; opacity: 0.6;' : ''}">${task.taskName}</td>
                        <td style="text-align: center;">
                            <label class="toggle-switch">
                                <input type="checkbox" class="chk-task-done" data-id="${task.id}" ${isDone ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        </td>
                        <td style="text-align: center; color: var(--text-muted); font-size: 12px;">-</td>
                    `;
                    todayScheduleBody.appendChild(tr);
                });
            }

            // イベントリスナーの付与
            document.querySelectorAll(".chk-post-done").forEach(chk => {
                chk.addEventListener("change", async (e) => {
                    const id = e.target.getAttribute("data-id");
                    const checked = e.target.checked;
                    await updatePostField(id, "isDone", checked);
                });
            });

            document.querySelectorAll(".chk-post-thumb").forEach(chk => {
                chk.addEventListener("change", async (e) => {
                    const id = e.target.getAttribute("data-id");
                    const checked = e.target.checked;
                    await updatePostField(id, "thumbnailDone", checked);
                });
            });

            document.querySelectorAll(".chk-task-done").forEach(chk => {
                chk.addEventListener("change", async (e) => {
                    const id = e.target.getAttribute("data-id");
                    const checked = e.target.checked;
                    await updateTaskField(id, "status", checked ? "完了" : "未完了");
                });
            });

            // 3. 今日の達成率計算と反映
            let percent = todayTotal === 0 ? 0 : Math.round((todayDoneCount / todayTotal) * 100);
            
            // 円形プログレス更新
            const radius = 50;
            const circumference = 2 * Math.PI * radius; // 314.16
            const offset = circumference - (percent / 100) * circumference;
            progressCircle.style.strokeDashoffset = offset;
            
            progressText.textContent = `${percent}%`;
            progressSub.textContent = `完了 ${todayDoneCount} / 総予定 ${todayTotal} 件`;

            // 4. 総予定カード
            todayTotalCount.textContent = `${todayTotal} 件`;
            todayDetailsSub.textContent = `投稿: ${todayPosts.length} 件 | タスク: ${todayTasks.length} 件`;

            // 5. 今週の残り未完了タスク
            // 直近7日以内の未完了
            const oneWeekLater = new Date();
            oneWeekLater.setDate(now.getDate() + 7);
            
            const weekPostsRemaining = dbPosts.filter(p => {
                const pDate = new Date(p.postDate);
                return pDate >= now && pDate <= oneWeekLater && !p.isDone;
            }).length;

            const weekTasksRemaining = dbTasks.filter(t => {
                const tDate = new Date(t.dueDate);
                return tDate >= now && tDate <= oneWeekLater && t.status !== "完了";
            }).length;

            const weekTotalRemaining = weekPostsRemaining + weekTasksRemaining;
            weekRemainingTasks.textContent = `${weekTotalRemaining} 件`;
            weekDetailsSub.textContent = `投稿未完了: ${weekPostsRemaining} 件 | タスク未完了: ${weekTasksRemaining} 件`;
        }

        // フィールド値更新ヘルパー (Posts)
        async function updatePostField(id, field, value) {
            if (isOnline) {
                try {
                    const docRef = doc(db, "posts", id);
                    await updateDoc(docRef, { [field]: value });
                } catch (err) {
                    console.error("Failed to update Firestore, local update:", err);
                    updateLocalPost(id, field, value);
                }
            } else {
                updateLocalPost(id, field, value);
            }
        }

        function updateLocalPost(id, field, value) {
            dbPosts = dbPosts.map(p => p.id === id ? { ...p, [field]: value } : p);
            localStorage.setItem("lunags_posts", JSON.stringify(dbPosts));
            updateUI();
        }

        // フィールド値更新ヘルパー (Tasks)
        async function updateTaskField(id, field, value) {
            if (isOnline) {
                try {
                    const docRef = doc(db, "tasks", id);
                    await updateDoc(docRef, { [field]: value });
                } catch (err) {
                    console.error("Failed to update Firestore, local update:", err);
                    updateLocalTask(id, field, value);
                }
            } else {
                updateLocalTask(id, field, value);
            }
        }

        function updateLocalTask(id, field, value) {
            dbTasks = dbTasks.map(t => t.id === id ? { ...t, [field]: value } : t);
            localStorage.setItem("lunags_tasks", JSON.stringify(dbTasks));
            updateUI();
        }

        // 通知ベル・ドロップダウン開閉
        bellContainer.addEventListener("click", (e) => {
            e.stopPropagation();
            notificationDropdown.classList.toggle("active");
        });

        document.addEventListener("click", () => {
            notificationDropdown.classList.remove("active");
        });

        notificationDropdown.addEventListener("click", (e) => {
            e.stopPropagation();
        });

        // 通知UIの更新
        function updateNotificationsUI() {
            const unreadCount = dbNotifications.filter(n => !n.read).length;
            if (unreadCount > 0) {
                bellBadge.style.display = "block";
            } else {
                bellBadge.style.display = "none";
            }

            notificationList.innerHTML = "";
            if (dbNotifications.length === 0) {
                notificationList.innerHTML = `<div class="notification-empty">通知はありません</div>`;
            } else {
                dbNotifications.forEach(notif => {
                    const div = document.createElement("div");
                    div.className = `notification-item ${notif.read ? '' : 'unread'}`;
                    
                    let dateStr = "日付不明";
                    if (notif.createdAt) {
                        const date = notif.createdAt.toDate ? notif.createdAt.toDate() : new Date(notif.createdAt);
                        dateStr = date.toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                    }

                    div.innerHTML = `
                        <div class="message">${escapeHtml(notif.message)}</div>
                        <div class="time">${dateStr}</div>
                    `;

                    div.addEventListener("click", async () => {
                        if (!notif.read) {
                            await markNotificationAsRead(notif.id);
                        }
                        if (notif.link) {
                            window.location.href = notif.link;
                        }
                    });

                    notificationList.appendChild(div);
                });
            }
        }

        // 通知の既読処理
        async function markNotificationAsRead(id) {
            if (isOnline) {
                try {
                    const docRef = doc(db, "notifications", id);
                    await updateDoc(docRef, { read: true });
                } catch (err) {
                    console.error(err);
                    updateLocalNotificationRead(id);
                }
            } else {
                updateLocalNotificationRead(id);
            }
        }

        function updateLocalNotificationRead(id) {
            dbNotifications = dbNotifications.map(n => n.id === id ? { ...n, read: true } : n);
            localStorage.setItem("lunags_notifications", JSON.stringify(dbNotifications));
            updateNotificationsUI();
        }

        // すべて既読にする
        btnClearNotifications.addEventListener("click", async () => {
            const unreadList = dbNotifications.filter(n => !n.read);
            for (const notif of unreadList) {
                await markNotificationAsRead(notif.id);
            }
        });

        // トースト通知の作成
        function showToast(message, type = "info") {
            const toast = document.createElement("div");
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-content">
                    <div class="toast-title">${type === 'success' ? '完了' : '新着通知'}</div>
                    <div class="toast-desc">${escapeHtml(message)}</div>
                </div>
                <div class="toast-close">&times;</div>
            `;

            toastContainer.appendChild(toast);

            // トーストクリックでカレンダーにジャンプ
            toast.addEventListener("click", (e) => {
                if (!e.target.classList.contains("toast-close")) {
                    window.location.href = "calendar.html";
                }
            });

            // 閉じるボタン
            toast.querySelector(".toast-close").addEventListener("click", (e) => {
                e.stopPropagation();
                toast.classList.add("hide");
                setTimeout(() => toast.remove(), 300);
            });

            // 5秒後に自動消滅
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.add("hide");
                    setTimeout(() => toast.remove(), 300);
                }
            }, 5000);
        }

        // HTMLエスケープヘルパー
        function escapeHtml(str) {
            if (!str) return "";
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 検索機能
        searchInput.addEventListener("input", (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query.length === 0) {
                searchResultsPanel.classList.remove("active");
                return;
            }

            searchResultsPanel.classList.add("active");
            searchResultsBody.innerHTML = "";

            // ポストから検索
            const matchedPosts = dbPosts.filter(p => 
                p.title.toLowerCase().includes(query) || 
                (p.memberName && p.memberName.toLowerCase().includes(query))
            );

            // タスクから検索
            const matchedTasks = dbTasks.filter(t => 
                t.taskName.toLowerCase().includes(query) || 
                (t.memberName && t.memberName.toLowerCase().includes(query))
            );

            if (matchedPosts.length === 0 && matchedTasks.length === 0) {
                searchResultsBody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-muted);">一致する予定は見つかりませんでした</td>
                    </tr>
                `;
                return;
            }

            // マッチしたポストの描画
            matchedPosts.forEach(post => {
                const tr = document.createElement("tr");
                tr.style.cursor = "pointer";
                tr.innerHTML = `
                    <td><span class="badge" style="background-color: var(--color-primary-light); color: var(--color-primary);">ポスト</span></td>
                    <td>${post.postDate}</td>
                    <td>${post.timeSlot || "未定"}</td>
                    <td>${post.memberName || "-"}</td>
                    <td>${post.title}</td>
                    <td><span class="badge ${post.isDone ? 'badge-success' : 'badge-warning'}">${post.isDone ? '配信完了' : '予定通り'}</span></td>
                `;
                tr.addEventListener("click", () => {
                    window.location.href = `posts.html?id=${post.id}`;
                });
                searchResultsBody.appendChild(tr);
            });

            // マッチしたタスクの描画
            matchedTasks.forEach(task => {
                const tr = document.createElement("tr");
                tr.style.cursor = "pointer";
                const isDone = task.status === "完了";
                tr.innerHTML = `
                    <td><span class="badge badge-success">タスク</span></td>
                    <td>${task.dueDate}</td>
                    <td>終日</td>
                    <td>${task.memberName || "-"}</td>
                    <td>${task.taskName}</td>
                    <td><span class="badge ${isDone ? 'badge-success' : 'badge-warning'}">${task.status}</span></td>
                `;
                tr.addEventListener("click", () => {
                    window.location.href = `tasks.html?id=${task.id}`;
                });
                searchResultsBody.appendChild(tr);
            });
        });

        btnCloseSearch.addEventListener("click", () => {
            searchInput.value = "";
            searchResultsPanel.classList.remove("active");
        });
    </script>
</body>
</html>
