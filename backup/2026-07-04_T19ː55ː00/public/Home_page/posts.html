<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポスト管理 - LUNAGS 管理システム</title>
    <link rel="stylesheet" href="home.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <!-- サイドバー -->
        <aside class="sidebar">
            <div class="logo-container">
                <img src="../images/logo_LUNAGS.png" alt="LUNAGS LOGO">
            </div>
            <nav class="menu-list">
                <!-- ダッシュボード (ホーム) -->
                <a href="home.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    ダッシュボード
                </a>
                <!-- カレンダー -->
                <a href="calendar.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
                    カレンダー
                </a>
                <!-- ポスト (投稿予定) -->
                <a href="posts.html" class="menu-item active">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    ポスト (投稿予定)
                </a>
                <!-- タスク -->
                <a href="tasks.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    タスク
                </a>
                <!-- 統計 -->
                <a href="statistics.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                    統計
                </a>
                <!-- 設定 -->
                <a href="settings.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    設定
                </a>
                <!-- マイページ -->
                <a href="../My_page/profile.html" class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    マイページ
                </a>
            </nav>
            <div class="logout-btn-container">
                <button class="logout-btn" id="btn-logout">
                    <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                    ログアウト
                </button>
            </div>
        </aside>

        <!-- メインコンテンツ -->
        <main class="content">
            <!-- ヘッダーツールバー -->
            <header class="toolbar">
                <div class="page-title">ポスト管理 (投稿予定)</div>
                <div class="header-right">
                    <!-- 予定検索 -->
                    <div class="search-container">
                        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <input type="text" class="search-input" id="search-input" placeholder="予定を検索...">
                    </div>
                    
                    <!-- 通知ベル -->
                    <div class="bell-container" id="bell-container">
                        <svg class="bell-icon" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                        <div class="bell-badge" id="bell-badge"></div>
                    </div>
                    
                    <!-- Firestore 接続ステータス -->
                    <div class="status-indicator online" id="status-indicator">
                        <span class="status-dot"></span>
                        <span id="status-text">Firestore オンライン</span>
                    </div>
                </div>
            </header>

            <!-- 通知ドロップダウン -->
            <div class="notification-dropdown" id="notification-dropdown">
                <div class="notification-header">
                    <span>通知一覧</span>
                    <span class="clear-notifications" id="btn-clear-notifications">すべて既読にする</span>
                </div>
                <div class="notification-list" id="notification-list">
                    <div class="notification-empty">通知はありません</div>
                </div>
            </div>

            <!-- メインパネル -->
            <div class="main-panel">
                <!-- 検索結果パネル (検索時のみ表示) -->
                <section class="search-results-panel" id="search-results-panel">
                    <div class="search-results-title">
                        <span>検索結果</span>
                        <span class="close-search" id="btn-close-search">閉じる</span>
                    </div>
                    <div class="table-container">
                        <table class="responsive-table">
                            <thead>
                                <tr>
                                    <th>区分</th>
                                    <th>日付</th>
                                    <th>時間/期限</th>
                                    <th>担当者</th>
                                    <th>タイトル</th>
                                    <th>ステータス</th>
                                </tr>
                            </thead>
                            <tbody id="search-results-body"></tbody>
                        </table>
                    </div>
                </section>

                <!-- ポスト新規追加フォーム -->
                <section class="form-container">
                    <div style="font-weight: 700; font-size: 16px; margin-bottom: 16px;">新規投稿予定の作成</div>
                    <form id="new-post-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>配信日</label>
                                <input type="date" id="post-date" required>
                            </div>
                            <div class="form-group">
                                <label>配信時間</label>
                                <input type="time" id="post-time" value="19:00" required>
                            </div>
                            <div class="form-group">
                                <label>担当メンバー</label>
                                <select id="post-member">
                                    <option value="なぎさ">なぎさ</option>
                                    <option value="メンバーA">メンバーA</option>
                                    <option value="メンバーB">メンバーB</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group" style="margin-bottom: 16px;">
                            <label>投稿タイトル / 配信名 (文中に @なぎさ 等で別途メンション可能)</label>
                            <input type="text" id="post-title" placeholder="【ゲーム配信】APEX配信！ @メンバーA も参加！" required>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="btn-mock-data">テストデータを自動登録</button>
                            <button type="submit" class="btn btn-primary">予定を追加して通知</button>
                        </div>
                    </form>
                </section>

                <!-- ポスト一覧テーブル -->
                <section class="table-container">
                    <table class="responsive-table">
                        <thead>
                            <tr>
                                <th style="width: 140px;">日付</th>
                                <th style="width: 100px;">時間</th>
                                <th style="width: 140px;">担当者</th>
                                <th>配信タイトル</th>
                                <th style="width: 120px; text-align: center;">配信完了</th>
                                <th style="width: 120px; text-align: center;">サムネ完了</th>
                                <th style="width: 100px; text-align: center;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="posts-table-body">
                            <!-- JSで動的に構築 -->
                            <tr>
                                <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 32px;">投稿予定が登録されていません</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </div>
        </main>
    </div>

    <!-- トースト通知 -->
    <div class="toast-container" id="toast-container"></div>

    <script type="module">
        import { auth, db } from "../firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { collection, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        // DOM Elements
        const newPostForm = document.getElementById("new-post-form");
        const postDate = document.getElementById("post-date");
        const postTime = document.getElementById("post-time");
        const postMember = document.getElementById("post-member");
        const postTitle = document.getElementById("post-title");
        const postsTableBody = document.getElementById("posts-table-body");
        const btnMockData = document.getElementById("btn-mock-data");

        const searchInput = document.getElementById("search-input");
        const searchResultsPanel = document.getElementById("search-results-panel");
        const searchResultsBody = document.getElementById("search-results-body");
        const btnCloseSearch = document.getElementById("btn-close-search");

        const bellContainer = document.getElementById("bell-container");
        const bellBadge = document.getElementById("bell-badge");
        const notificationDropdown = document.getElementById("notification-dropdown");
        const notificationList = document.getElementById("notification-list");
        const btnClearNotifications = document.getElementById("btn-clear-notifications");
        const statusIndicator = document.getElementById("status-indicator");
        const statusText = document.getElementById("status-text");
        const btnLogout = document.getElementById("btn-logout");

        // State
        let currentUser = null;
        let isOnline = true;
        let dbPosts = [];
        let dbTasks = [];
        let dbNotifications = [];

        // 配信日を今日の曜日に初期設定
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        postDate.value = `${y}-${m}-${d}`;

        // URLパラメータからのハイライト処理
        const urlParams = new URLSearchParams(window.location.search);
        const highlightId = urlParams.get("id");

        // ログアウト
        btnLogout.addEventListener("click", async () => {
            if (confirm("ログアウトしますか？")) {
                await signOut(auth);
                window.location.href = "../Login_page/login.html";
            }
        });

        // ログイン状態監視
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                initDataSync();
            } else {
                window.location.href = "../Login_page/login.html";
            }
        });

        // 同期
        async function initDataSync() {
            try {
                const testRef = doc(db, "system", "health");
                await getDoc(testRef);
                setOnlineStatus(true);

                onSnapshot(collection(db, "posts"), (snapshot) => {
                    dbPosts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // 日付順にソート
                    dbPosts.sort((a, b) => new Date(a.postDate + "T" + (a.timeSlot || "00:00")) - new Date(b.postDate + "T" + (b.timeSlot || "00:00")));
                    localStorage.setItem("lunags_posts", JSON.stringify(dbPosts));
                    renderPostsTable();
                });

                onSnapshot(collection(db, "tasks"), (snapshot) => {
                    dbTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    localStorage.setItem("lunags_tasks", JSON.stringify(dbTasks));
                });

                onSnapshot(collection(db, "notifications"), (snapshot) => {
                    const allNotifs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    dbNotifications = allNotifs.filter(n => n.recipientEmail === currentUser.email || n.recipientEmail === "all")
                                               .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    localStorage.setItem("lunags_notifications", JSON.stringify(dbNotifications));
                    updateNotificationsUI();
                });
            } catch (err) {
                console.warn("Firestore error, entering local mode:", err);
                fallbackToLocal();
            }
        }

        function setOnlineStatus(online) {
            isOnline = online;
            if (online) {
                statusIndicator.className = "status-indicator online";
                statusText.textContent = "Firestore オンライン";
            } else {
                statusIndicator.className = "status-indicator offline";
                statusText.textContent = "ローカルモード";
            }
        }

        function fallbackToLocal() {
            setOnlineStatus(false);
            dbPosts = JSON.parse(localStorage.getItem("lunags_posts")) || [];
            dbPosts.sort((a, b) => new Date(a.postDate + "T" + (a.timeSlot || "00:00")) - new Date(b.postDate + "T" + (b.timeSlot || "00:00")));
            dbTasks = JSON.parse(localStorage.getItem("lunags_tasks")) || [];
            dbNotifications = JSON.parse(localStorage.getItem("lunags_notifications")) || [];
            renderPostsTable();
            updateNotificationsUI();
        }

        // --- テーブル描画 ---
        function renderPostsTable() {
            postsTableBody.innerHTML = "";

            if (dbPosts.length === 0) {
                postsTableBody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 32px;">投稿予定が登録されていません</td>
                    </tr>
                `;
                return;
            }

            dbPosts.forEach(post => {
                const tr = document.createElement("tr");
                if (highlightId && post.id === highlightId) {
                    tr.style.backgroundColor = "var(--color-primary-light)";
                    setTimeout(() => { tr.style.backgroundColor = ""; }, 5000); // 5秒でハイライト解除
                }

                tr.innerHTML = `
                    <td>${post.postDate}</td>
                    <td>${post.timeSlot || "-"}</td>
                    <td>${post.memberName || "-"}</td>
                    <td style="${post.isDone ? 'text-decoration: line-through; opacity: 0.6;' : ''}" class="title-td">${escapeHtml(post.title)}</td>
                    <td style="text-align: center;">
                        <label class="toggle-switch">
                            <input type="checkbox" class="chk-post-done" data-id="${post.id}" ${post.isDone ? 'checked' : ''}>
                            <span class="slider"></span>
                        </label>
                    </td>
                    <td style="text-align: center;">
                        <label class="toggle-switch">
                            <input type="checkbox" class="chk-post-thumb" data-id="${post.id}" ${post.thumbnailDone ? 'checked' : ''}>
                            <span class="slider" style="background-color: ${post.thumbnailDone ? 'var(--color-success)' : ''};"></span>
                        </label>
                    </td>
                    <td style="text-align: center;">
                        <button class="btn-delete" data-id="${post.id}" style="background:transparent; border:none; color:var(--color-danger); cursor:pointer; font-size:12px; font-weight:600;">削除</button>
                    </td>
                `;

                postsTableBody.appendChild(tr);
            });

            // イベント付与
            document.querySelectorAll(".chk-post-done").forEach(chk => {
                chk.addEventListener("change", async (e) => {
                    const id = e.target.getAttribute("data-id");
                    const checked = e.target.checked;
                    await updatePostField(id, "isDone", checked);
                });
            });

            document.querySelectorAll(".chk-post-thumb").forEach(chk => {
                chk.addEventListener("change", async (e) => {
                    const id = e.target.getAttribute("data-id");
                    const checked = e.target.checked;
                    await updatePostField(id, "thumbnailDone", checked);
                });
            });

            document.querySelectorAll(".btn-delete").forEach(btn => {
                btn.addEventListener("click", async (e) => {
                    if (confirm("この予定を削除しますか？")) {
                        const id = e.target.getAttribute("data-id");
                        await deletePost(id);
                    }
                });
            });
        }

        async function updatePostField(id, field, value) {
            if (isOnline) {
                await updateDoc(doc(db, "posts", id), { [field]: value });
            } else {
                dbPosts = dbPosts.map(p => p.id === id ? { ...p, [field]: value } : p);
                localStorage.setItem("lunags_posts", JSON.stringify(dbPosts));
                renderPostsTable();
            }
        }

        async function deletePost(id) {
            if (isOnline) {
                await deleteDoc(doc(db, "posts", id));
            } else {
                dbPosts = dbPosts.filter(p => p.id !== id);
                localStorage.setItem("lunags_posts", JSON.stringify(dbPosts));
                renderPostsTable();
            }
        }

        // --- 新規登録とメンション通知 ---
        newPostForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const titleVal = postTitle.value.trim();
            const dateVal = postDate.value;
            const timeVal = postTime.value;
            const memberVal = postMember.value;

            if (!titleVal) return;

            const newPost = {
                title: titleVal,
                postDate: dateVal,
                timeSlot: timeVal,
                memberName: memberVal,
                isDone: false,
                thumbnailDone: false,
                createdAt: new Date().toISOString()
            };

            const memberEmails = {
                "なぎさ": "nagisa@example.com",
                "メンバーA": "memberA@example.com",
                "メンバーB": "memberB@example.com"
            };

            // 1. 担当者への通知
            const recipientEmail = memberEmails[memberVal] || "all";

            if (isOnline) {
                // ポスト追加
                await addDoc(collection(db, "posts"), newPost);

                // 通知ドキュメント追加
                await addDoc(collection(db, "notifications"), {
                    recipientEmail,
                    type: "mention",
                    message: `${currentUser.email} があなたを新しい投稿予定の担当に指定しました: 「${titleVal}」`,
                    link: "posts.html",
                    read: false,
                    createdAt: serverTimestamp()
                });

                // 2. 本文中に @名前 がある場合の追加メンション通知
                // 例: "APEX配信 @メンバーA も参加"
                const mentions = ["なぎさ", "メンバーA", "メンバーB"].filter(name => titleVal.includes(`@${name}`) && name !== memberVal);
                for (const name of mentions) {
                    const mentionEmail = memberEmails[name];
                    if (mentionEmail) {
                        await addDoc(collection(db, "notifications"), {
                            recipientEmail: mentionEmail,
                            type: "mention",
                            message: `${currentUser.email} が投稿「${titleVal}」であなたをメンションしました。`,
                            link: "posts.html",
                            read: false,
                            createdAt: serverTimestamp()
                        });
                    }
                }
            } else {
                const localPost = { id: "lp_" + Date.now(), ...newPost };
                dbPosts.push(localPost);
                localStorage.setItem("lunags_posts", JSON.stringify(dbPosts));
                dbPosts.sort((a, b) => new Date(a.postDate + "T" + (a.timeSlot || "00:00")) - new Date(b.postDate + "T" + (b.timeSlot || "00:00")));
                renderPostsTable();
            }

            // フォームリセット
            postTitle.value = "";
        });

        // --- テスト用ダミーデータ自動登録 ---
        btnMockData.addEventListener("click", async () => {
            if (!confirm("テスト用の投稿予定・タスクの初期データを登録しますか？")) return;

            const dummyPosts = [
                { title: "【雑談配信】週末の計画発表会 @なぎさ", postDate: postDate.value, timeSlot: "12:00", memberName: "なぎさ", isDone: false, thumbnailDone: false },
                { title: "【ゲーム実況】マリオカート視聴者参加型", postDate: postDate.value, timeSlot: "19:00", memberName: "メンバーA", isDone: false, thumbnailDone: false },
                { title: "歌ってみたMVプレミア公開: ロキ", postDate: postDate.value, timeSlot: "21:00", memberName: "メンバーB", isDone: false, thumbnailDone: true }
            ];

            const dummyTasks = [
                { taskName: "新MVのサムネイル文字入れ確認", dueDate: postDate.value, memberName: "なぎさ", status: "未完了" },
                { taskName: "コラボ配信用のDiscordサーバー用意", dueDate: postDate.value, memberName: "メンバーA", status: "未完了" },
                { taskName: "配信音量のテストとアセットチェック", dueDate: postDate.value, memberName: "メンバーB", status: "完了" }
            ];

            if (isOnline) {
                for (const post of dummyPosts) {
                    await addDoc(collection(db, "posts"), post);
                }
                for (const task of dummyTasks) {
                    await addDoc(collection(db, "tasks"), task);
                }
                alert("Firestoreにテストデータを登録しました！");
            } else {
                dbPosts.push(...dummyPosts.map((p, idx) => ({ id: "lp_mock_" + idx + "_" + Date.now(), ...p })));
                localStorage.setItem("lunags_posts", JSON.stringify(dbPosts));
                dbPosts.sort((a, b) => new Date(a.postDate + "T" + (a.timeSlot || "00:00")) - new Date(b.postDate + "T" + (b.timeSlot || "00:00")));
                
                // タスク側もストレージ保存
                const localTasks = JSON.parse(localStorage.getItem("lunags_tasks")) || [];
                localTasks.push(...dummyTasks.map((t, idx) => ({ id: "lt_mock_" + idx + "_" + Date.now(), ...t })));
                localStorage.setItem("lunags_tasks", JSON.stringify(localTasks));

                renderPostsTable();
                alert("ローカルストレージにテストデータを登録しました！");
            }
        });

        // HTMLエスケープ
        function escapeHtml(str) {
            if (!str) return "";
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // --- 通知UI関係のロジック ---
        bellContainer.addEventListener("click", (e) => {
            e.stopPropagation();
            notificationDropdown.classList.toggle("active");
        });

        document.addEventListener("click", () => {
            notificationDropdown.classList.remove("active");
        });

        function updateNotificationsUI() {
            const unreadCount = dbNotifications.filter(n => !n.read).length;
            bellBadge.style.display = unreadCount > 0 ? "block" : "none";

            notificationList.innerHTML = "";
            if (dbNotifications.length === 0) {
                notificationList.innerHTML = `<div class="notification-empty">通知はありません</div>`;
            } else {
                dbNotifications.forEach(notif => {
                    const div = document.createElement("div");
                    div.className = `notification-item ${notif.read ? '' : 'unread'}`;
                    
                    let dateStr = "日付不明";
                    if (notif.createdAt) {
                        const date = notif.createdAt.toDate ? notif.createdAt.toDate() : new Date(notif.createdAt);
                        dateStr = date.toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                    }

                    div.innerHTML = `
                        <div class="message">${escapeHtml(notif.message)}</div>
                        <div class="time">${dateStr}</div>
                    `;

                    div.addEventListener("click", async () => {
                        if (!notif.read) {
                            if (isOnline) {
                                await updateDoc(doc(db, "notifications", notif.id), { read: true });
                            } else {
                                dbNotifications = dbNotifications.map(n => n.id === notif.id ? { ...n, read: true } : n);
                                localStorage.setItem("lunags_notifications", JSON.stringify(dbNotifications));
                                updateNotificationsUI();
                            }
                        }
                        if (notif.link) {
                            window.location.href = notif.link;
                        }
                    });

                    notificationList.appendChild(div);
                });
            }
        }

        btnClearNotifications.addEventListener("click", async () => {
            const unreadList = dbNotifications.filter(n => !n.read);
            for (const notif of unreadList) {
                if (isOnline) {
                    await updateDoc(doc(db, "notifications", notif.id), { read: true });
                } else {
                    dbNotifications = dbNotifications.map(n => n.id === notif.id ? { ...n, read: true } : n);
                }
            }
            if (!isOnline) {
                localStorage.setItem("lunags_notifications", JSON.stringify(dbNotifications));
                updateNotificationsUI();
            }
        });

        // 検索窓
        searchInput.addEventListener("input", (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query.length === 0) {
                searchResultsPanel.classList.remove("active");
                return;
            }

            searchResultsPanel.classList.add("active");
            searchResultsBody.innerHTML = "";

            const matchedPosts = dbPosts.filter(p => p.title.toLowerCase().includes(query) || (p.memberName && p.memberName.toLowerCase().includes(query)));
            const matchedTasks = dbTasks.filter(t => t.taskName.toLowerCase().includes(query) || (t.memberName && t.memberName.toLowerCase().includes(query)));

            if (matchedPosts.length === 0 && matchedTasks.length === 0) {
                searchResultsBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">一致する予定は見つかりませんでした</td></tr>`;
                return;
            }

            matchedPosts.forEach(post => {
                const tr = document.createElement("tr");
                tr.style.cursor = "pointer";
                tr.innerHTML = `
                    <td><span class="badge" style="background-color: var(--color-primary-light); color: var(--color-primary);">ポスト</span></td>
                    <td>${post.postDate}</td>
                    <td>${post.timeSlot || "未定"}</td>
                    <td>${post.memberName || "-"}</td>
                    <td>${post.title}</td>
                    <td><span class="badge ${post.isDone ? 'badge-success' : 'badge-warning'}">${post.isDone ? '配信完了' : '予定通り'}</span></td>
                `;
                tr.addEventListener("click", () => {
                    window.location.href = `posts.html?id=${post.id}`;
                });
                searchResultsBody.appendChild(tr);
            });

            matchedTasks.forEach(task => {
                const tr = document.createElement("tr");
                tr.style.cursor = "pointer";
                tr.innerHTML = `
                    <td><span class="badge badge-success">タスク</span></td>
                    <td>${task.dueDate}</td>
                    <td>終日</td>
                    <td>${task.memberName || "-"}</td>
                    <td>${task.taskName}</td>
                    <td><span class="badge ${task.status === '完了' ? 'badge-success' : 'badge-warning'}">${task.status}</span></td>
                `;
                tr.addEventListener("click", () => {
                    window.location.href = `tasks.html?id=${task.id}`;
                });
                searchResultsBody.appendChild(tr);
            });
        });

        btnCloseSearch.addEventListener("click", () => {
            searchInput.value = "";
            searchResultsPanel.classList.remove("active");
        });
    </script>
</body>
</html>
