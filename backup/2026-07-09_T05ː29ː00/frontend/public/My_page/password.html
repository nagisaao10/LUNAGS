<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード設定 | LUNAGS 管理システム</title>
    <link rel="stylesheet" href="../reset.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="mypage.css">
</head>

<body>

    <!-- SP用ハンバーガー -->
    <button class="hamburger" id="hamburgerBtn">
        <i class="fas fa-bars"></i>
    </button>

    <div class="page">

        <!-- サイドバー -->
        <aside class="sidebar" id="sidebar">

            <img src="../images/logo_LUNAGS.png" class="logo-lunags" alt="Logo">

            <div class="menu-list">

                <a href="../Home_page/home.html" class="menu">
                    <i class="fas fa-desktop"></i>
                    管理ホーム
                </a>

                <!-- 本人情報 -->
                <a href="profile.html" class="menu">
                    <i class="fas fa-user"></i>
                    本人情報
                </a>

                <!-- アカウント情報 -->
                <a href="account.html" class="menu active">
                    <i class="fas fa-id-card"></i>
                    アカウント情報
                </a>

                <!-- 外部サービス -->
                <a href="external.html" class="menu">
                    <i class="fas fa-link"></i>
                    外部サービス
                </a>

                <!-- 連携サービス -->
                <a href="platforms.html" class="menu">
                    <i class="fas fa-cog"></i>
                    連携サービス
                </a>

            </div>

            <button class="btn logout-btn" id="logoutBtn">
                ログアウト
            </button>

        </aside>

        <!-- メイン -->
        <main class="main fade-in">

            <h1>PASSWORD RESET</h1>
            <div class="sub">パスワード設定</div>

            <!-- アカウント情報 -->
            <div class="card">

                <div class="section-title">
                    パスワード設定
                </div>

                <div class="row">
                    <div class="label">現在のパスワード</div>
                    <div class="value">
                        <input type="password" id="currentPassword" placeholder="初回設定時は不要">
                    </div>
                </div>

                <div class="row">
                    <div class="label">新しいパスワード</div>
                    <div class="value">
                        <input type="password" id="newPassword" placeholder="6文字以上">
                    </div>
                </div>

                <div class="row">
                    <div class="label">確認用パスワード</div>
                    <div class="value">
                        <input type="password" id="confirmPassword" placeholder="もう一度入力">
                    </div>
                </div>

                <div class="row">
                    <div class="value">
                        <button id="passwordBtn" class="btn edit-btn">
                            設定する
                        </button>
                    </div>
                </div>

            </div>

        </main>

    </div>

    <!-- フッター -->
    <footer class="footer">
        <a href="#">利用規約</a>
        <a href="#">FAQ</a>
        <a href="#">運営会社</a>
        <a href="#">Language: JA</a>
    </footer>

    <script type="module">

        import { auth } from "../firebase-config.js";

        import {
            onAuthStateChanged,
            signOut,
            EmailAuthProvider,
            linkWithCredential,
            reauthenticateWithCredential,
            updatePassword
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        // DOM
        const logoutBtn =
            document.getElementById("logoutBtn");

        const hamburgerBtn =
            document.getElementById("hamburgerBtn");

        const sidebar =
            document.getElementById("sidebar");

        const passwordBtn =
            document.getElementById("passwordBtn");

        const newPassword =
            document.getElementById("newPassword");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const currentPassword =
            document.getElementById("currentPassword");

        passwordBtn.addEventListener("click", async () => {

            const user = auth.currentUser;

            if (!user) {
                alert("ログインしてください");
                return;
            }

            const newPass =
                newPassword.value.trim();

            const confirmPass =
                confirmPassword.value.trim();

            if (newPass.length < 6) {
                alert("パスワードは6文字以上で入力してください");
                return;
            }

            if (newPass !== confirmPass) {
                alert("確認用パスワードが一致しません");
                return;
            }

            try {

                const hasPasswordProvider =
                    user.providerData.some(
                        p => p.providerId === "password"
                    );

                // 初回設定
                if (!hasPasswordProvider) {

                    const credential =
                        EmailAuthProvider.credential(
                            user.email,
                            newPass
                        );

                    await linkWithCredential(
                        user,
                        credential
                    );

                    alert(
                        "パスワードを設定しました。\n今後はメールアドレスとパスワードでもログインできます。"
                    );

                }

                // 変更
                else {

                    if (!currentPassword.value) {

                        alert(
                            "現在のパスワードを入力してください"
                        );

                        return;

                    }

                    const credential =
                        EmailAuthProvider.credential(
                            user.email,
                            currentPassword.value
                        );

                    await reauthenticateWithCredential(
                        user,
                        credential
                    );

                    await updatePassword(
                        user,
                        newPass
                    );

                    alert(
                        "パスワードを変更しました。"
                    );

                }

                currentPassword.value = "";
                newPassword.value = "";
                confirmPassword.value = "";

            } catch (error) {

                console.error(error);

                switch (error.code) {

                    case "auth/wrong-password":
                        alert("現在のパスワードが違います");
                        break;

                    case "auth/weak-password":
                        alert("パスワードが弱すぎます");
                        break;

                    case "auth/requires-recent-login":
                        alert(
                            "再ログイン後にもう一度お試しください"
                        );
                        break;

                    default:
                        alert(
                            "パスワード処理に失敗しました"
                        );
                }

            }

        });

        // SPメニュー
        hamburgerBtn.addEventListener("click", () => {

            sidebar.classList.toggle("open");

        });

        // 認証確認
        onAuthStateChanged(auth, (user) => {

            if (!user) {

                window.location.href =
                    "../Login_page/login.html";

            }

        });

        // ログアウト
        logoutBtn.addEventListener("click", async () => {

            if (!confirm("ログアウトしますか？")) return;

            try {

                await signOut(auth);

                window.location.href =
                    "../Login_page/login.html";

            } catch (error) {

                console.error(error);

            }

        });

    </script>

</body>

</html>
