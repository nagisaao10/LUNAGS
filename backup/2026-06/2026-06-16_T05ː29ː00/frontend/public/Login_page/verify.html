<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>確認コード認証</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="box">
        <h2>確認コード認証</h2>
        <p id="emailLabel"></p>
        <input id="code" inputmode="numeric" maxlength="6" placeholder="6桁コード">
        <div id="message" class="message"></div>
        <button id="verifyButton" onclick="verifyCode()">認証する</button>
        <button class="secondary" onclick="location.href='signup.html'">新規登録へ戻る</button>
    </div>

    <script type="module">
        import { doc, runTransaction } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
        import {
            db,
            VERIFICATION_COLLECTION,
            sha256,
            loadPendingSignup,
            saveLocalVerification,
            loadLocalVerification,
            clearLocalVerification,
            withTimeout,
            isOfflineDocumentError,
            getFriendlyErrorMessage
        } from "../firebase-config.js";

        const pendingSignup = loadPendingSignup();

        if (!pendingSignup?.email) {
            window.location.href = "signup.html";
        } else {
            document.getElementById("emailLabel").innerText = pendingSignup.email;
        }

        function setMessage(text, type = "") {
            const message = document.getElementById("message");
            message.className = `message ${type}`;
            message.innerText = text;
        }

        function verifyLocalCode(inputHash) {
            const data = loadLocalVerification(pendingSignup.email);

            if (!data) {
                return { ok: false, message: "確認コードが見つかりません。再送してください。", cleanup: true };
            }

            if (data.verified) {
                return { ok: true, message: "すでに認証済みです" };
            }

            if (Date.now() > data.expiresAt) {
                clearLocalVerification(pendingSignup.email);
                return { ok: false, message: "確認コードの有効期限が切れました", cleanup: true };
            }

            if (data.attemptCount >= data.maxAttempts) {
                clearLocalVerification(pendingSignup.email);
                return { ok: false, message: "試行回数の上限に達しました。最初からやり直してください。", cleanup: true };
            }

            if (data.codeHash !== inputHash) {
                const nextAttemptCount = data.attemptCount + 1;

                if (nextAttemptCount >= data.maxAttempts) {
                    clearLocalVerification(pendingSignup.email);
                    return {
                        ok: false,
                        message: "試行回数の上限に達しました。最初からやり直してください。",
                        cleanup: true
                    };
                }

                saveLocalVerification(pendingSignup.email, {
                    ...data,
                    attemptCount: nextAttemptCount,
                    updatedAt: Date.now()
                });

                return {
                    ok: false,
                    message: `コードが違います。残り ${data.maxAttempts - nextAttemptCount} 回です。`
                };
            }

            saveLocalVerification(pendingSignup.email, {
                ...data,
                verified: true,
                verifiedAt: Date.now(),
                updatedAt: Date.now()
            });

            return { ok: true, message: "認証が完了しました" };
        }

        window.verifyCode = async () => {
            const button = document.getElementById("verifyButton");
            const inputCode = document.getElementById("code").value.trim();
            const safeEmail = pendingSignup.email.replace(/\./g, "_").replace(/@/g, "_");

            if (!/^\d{6}$/.test(inputCode)) {

                setMessage(
                    "6桁の数字を入力してください", "error"
                );

                return;
            }

            button.disabled = true;

            setMessage(
                "コードを確認しています..."
            );

            try {
                const ref = doc(
                    db,
                    VERIFICATION_COLLECTION,
                    safeEmail
                );

                const inputHash =
                    await sha256(inputCode);

                let result;

                try {
                    result = await withTimeout(runTransaction(db, async (transaction) => {

                        const snap = await transaction.get(ref);
                        if (!snap.exists()) {
                            return { ok: false, message: "確認コードが見つかりません。再送してください。", cleanup: true };
                        }

                        const data = snap.data();
                        if (data.verified) {
                            return { ok: true, message: "すでに認証済みです" };
                        }

                        if (Date.now() > data.expiresAt) {
                            transaction.delete(ref);
                            return { ok: false, message: "確認コードの有効期限が切れました", cleanup: true };
                        }

                        if (data.attemptCount >= data.maxAttempts) {
                            transaction.delete(ref);
                            return { ok: false, message: "試行回数の上限に達しました。最初からやり直してください。", cleanup: true };
                        }

                        if (data.codeHash !== inputHash) {
                            const nextAttemptCount = data.attemptCount + 1;

                            if (nextAttemptCount >= data.maxAttempts) {
                                transaction.delete(ref);
                                return {
                                    ok: false,
                                    message: "試行回数の上限に達しました。最初からやり直してください。",
                                    cleanup: true
                                };
                            }

                            transaction.update(ref, {
                                attemptCount: nextAttemptCount,
                                updatedAt: Date.now()
                            });

                            return {
                                ok: false,
                                message: `コードが違います。残り ${data.maxAttempts - nextAttemptCount} 回です。`
                            };
                        }

                        transaction.update(ref, {
                            verified: true,
                            verifiedAt: Date.now(),
                            updatedAt: Date.now()
                        });

                        return { ok: true, message: "認証が完了しました" };
                    }));
                } catch (error) {
                    if (!isOfflineDocumentError(error)) {
                        throw error;
                    }

                    result = verifyLocalCode(inputHash);
                }

                if (!result.ok) {
                    setMessage(result.message, "error");

                    if (result.cleanup) {
                        setTimeout(() => {
                            window.location.href = "signup.html";
                        }, 1200);
                    }
                    return;
                }

                setMessage(result.message, "success");
                setTimeout(() => {
                    window.location.href = "set-password.html";
                }, 800);
            } catch (error) {
                setMessage(getFriendlyErrorMessage(error, "確認コード認証に失敗しました"), "error");
            } finally {
                button.disabled = false;
            }
        };
    </script>
</body>

</html>
