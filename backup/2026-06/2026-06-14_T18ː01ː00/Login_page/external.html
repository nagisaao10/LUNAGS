<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外部サービス</title>
    <link rel="stylesheet" href="mypage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- SP用ハンバーガー -->
    <button class="hamburger" id="hamburgerBtn">
        <i class="fas fa-bars"></i>
    </button>

    <div class="page">

        <!-- サイドバー -->
        <aside class="sidebar" id="sidebar">

            <img src="./images/logo2_white.png" class="logo-mixst" alt="Logo">

            <div class="menu-list">

                <a href="profile.html" class="menu">
                    <i class="fas fa-user"></i>
                    本人情報
                </a>

                <a href="account.html" class="menu">
                    <i class="fas fa-id-card"></i>
                    アカウント情報
                </a>

                <a href="external.html" class="menu active">
                    <i class="fas fa-link"></i>
                    外部サービス
                </a>

                <a href="platforms.html" class="menu">
                    <i class="fas fa-cog"></i>
                    連携サービス
                </a>

            </div>

            <button class="btn logout-btn" id="logoutBtn">
                ログアウト
            </button>

        </aside>

        <!-- メイン -->
        <main class="main fade-in">

            <h1>EXTERNAL</h1>
            <div class="sub">外部サービス</div>

            <!-- YouTube -->
            <div class="card">

                <div class="section-title">
                    YouTube
                </div>

                <div class="row">
                    <div class="label">
                        <i class="fa-brands fa-youtube"></i>
                        接続状態
                    </div>

                    <div class="value" id="youtubeStatus">
                        未接続
                    </div>
                </div>

                <button class="btn edit-btn" id="youtubeConnectBtn">
                    接続する
                </button>

                <div style="clear: both;"></div>

            </div>

            <!-- X -->
            <div class="card">
                <div class="section-title">
                    X (Twitter)
                </div>

                <div class="row">
                    <div class="label">
                        <i class="fa-brands fa-x-twitter"></i>
                        接続状態
                    </div>

                    <div class="value" id="xStatus">
                        未接続
                    </div>
                </div>

                <button class="btn edit-btn" id="xConnectBtn">
                    接続する
                </button>

                <div style="clear: both;"></div>

            </div>

            <!-- Discord -->
            <div class="card">

                <div class="section-title">
                    Discord
                </div>

                <div class="row">
                    <div class="label">
                        <i class="fab fa-discord"></i>
                        接続状態
                    </div>

                    <div class="value">
                        未接続
                    </div>
                </div>

                <button class="btn edit-btn" id="discordConnectBtn">
                    接続する
                </button>

                <div style="clear: both;"></div>

            </div>

        </main>

    </div>

    <script type="module">

        import { auth, db } from "../firebase-config.js";
        import {
            signOut,
            TwitterAuthProvider,
            linkWithPopup,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        import {
            doc,
            getDoc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        import {
            GoogleAuthProvider,
            reauthenticateWithPopup
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        const hamburgerBtn =
            document.getElementById("hamburgerBtn");

        const sidebar =
            document.getElementById("sidebar");

        const logoutBtn =
            document.getElementById("logoutBtn");

        hamburgerBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
        });

        // Youtube連携
        const youtubeConnectBtn =
            document.getElementById("youtubeConnectBtn");

        youtubeConnectBtn.addEventListener(
            "click",
            async () => {

                try {

                    const user = auth.currentUser;

                    if (!user) {
                        alert("ログインしてください");
                        return;
                    }

                    const provider =
                        new GoogleAuthProvider();

                    provider.addScope(
                        "https://www.googleapis.com/auth/youtube.readonly"
                    );

                    const result =
                        await reauthenticateWithPopup(
                            user,
                            provider
                        );

                    const credential =
                        GoogleAuthProvider
                            .credentialFromResult(result);

                    const accessToken =
                        credential.accessToken;

                    const response =
                        await fetch(
                            "https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true",
                            {
                                headers: {
                                    Authorization:
                                        `Bearer ${accessToken}`
                                }
                            }
                        );

                    const data =
                        await response.json();

                    if (!data.items?.length) {
                        throw new Error(
                            "YouTubeチャンネルが見つかりません"
                        );
                    }

                    const channel =
                        data.items[0];

                    await setDoc(
                        doc(
                            db,
                            "users",
                            user.uid
                        ),
                        {
                            youtubeConnected: true,

                            youtube: {
                                channelId: channel.id,
                                channelName:
                                    channel.snippet.title,
                                thumbnail:
                                    channel.snippet.thumbnails.default.url
                            }
                        },
                        {
                            merge: true
                        }
                    );

                    document.getElementById(
                        "youtubeStatus"
                    ).textContent =
                        "接続済み";

                    alert(
                        `YouTube連携完了\n${channel.snippet.title}`
                    );

                } catch (error) {

                    console.error(error);

                    alert(
                        "YouTube連携に失敗しました"
                    );

                }

            }
        );

        // X連携
        const xConnectBtn =
            document.getElementById("xConnectBtn");

        xConnectBtn.addEventListener("click", async () => {

            try {

                const provider =
                    new TwitterAuthProvider();

                const user =
                    auth.currentUser;

                await linkWithPopup(
                    user,
                    provider
                );

                alert("X連携完了");

                location.reload();

            } catch (error) {

                console.error(error);

                alert("連携に失敗しました");

            }

        });

        onAuthStateChanged(auth, (user) => {

            if (!user) {
                location.href = "/Login_page/";
                return;
            }

            const linked = user.providerData.some(
                p => p.providerId === "twitter.com"
            );

            document.getElementById("xStatus").textContent =
                linked ? "接続済み" : "未接続";

        });

        // Discord連携
        const discordClientId = "CLIENT_ID";

        document.getElementById("discordConnectBtn")
            .addEventListener("click", () => {

                const redirectUri =
                    encodeURIComponent(
                        location.origin + "/discord-callback.html"
                    );

                const url =
                    `https://discord.com/oauth2/authorize` +
                    `?client_id=${discordClientId}` +
                    `&response_type=token` +
                    `&scope=identify` +
                    `&redirect_uri=${redirectUri}`;

                location.href = url;
            });

        logoutBtn.addEventListener("click", async () => {

            if (confirm("ログアウトしますか？")) {

                await signOut(auth);

                window.location.href =
                    "/Login_page/";

            }

        });

    </script>

</body>

</html>
