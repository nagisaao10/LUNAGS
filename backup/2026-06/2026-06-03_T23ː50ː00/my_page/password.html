<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント情報</title>
    <link rel="stylesheet" href="mypage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- SP用ハンバーガー -->
    <button class="hamburger" id="hamburgerBtn">
        <i class="fas fa-bars"></i>
    </button>

    <div class="page">

        <!-- サイドバー -->
        <aside class="sidebar" id="sidebar">

            <img src="./images/logo_white.png" class="logo" alt="Logo">

            <div class="menu-list">

                <!-- 本人情報 -->
                <a href="profile.html" class="menu">
                    <i class="fas fa-user"></i>
                    本人情報
                </a>

                <!-- アカウント情報 -->
                <a href="account.html" class="menu active">
                    <i class="fas fa-id-card"></i>
                    アカウント情報
                </a>

                <!-- 外部サービス -->
                <a href="external.html" class="menu">
                    <i class="fas fa-link"></i>
                    外部サービス
                </a>

                <!-- 連携サービス -->
                <a href="platforms.html" class="menu">
                    <i class="fas fa-cog"></i>
                    連携サービス
                </a>

            </div>

            <button class="btn logout-btn" id="logoutBtn">
                ログアウト
            </button>

        </aside>

        <!-- メイン -->
        <main class="main fade-in">

            <h1>PASSWORD RESET</h1>
            <div class="sub">パスワード設定</div>

            <!-- アカウント情報 -->
            <div class="card">

                <div class="section-title">
                    パスワード設定
                </div>

                <div class="row">
                    <div class="label">パスワード設定</div>

                    <div class="value">
                        <button id="PasswordBtn" class="btn edit-btn">
                            設定する
                        </button>
                    </div>
                </div>

            </div>

        </main>

    </div>

    <script type="module">

        import { auth } from "../firebase-config.js";

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // DOM
        const logoutBtn =
            document.getElementById("logoutBtn");

        const hamburgerBtn =
            document.getElementById("hamburgerBtn");

        const sidebar =
            document.getElementById("sidebar");

        const passwordBtn =
            document.getElementById("passwordBtn");


        // SPメニュー
        hamburgerBtn.addEventListener("click", () => {

            sidebar.classList.toggle("open");

        });

        // 認証確認
        onAuthStateChanged(auth, (user) => {

            if (!user) {

                window.location.href =
                    "../Login_page/index.html";

            }

        });

        // ログアウト
        logoutBtn.addEventListener("click", async () => {

            if (!confirm("ログアウトしますか？")) return;

            try {

                await signOut(auth);

                window.location.href =
                    "../Login_page/";

            } catch (error) {

                console.error(error);

            }

        });

    </script>

</body>

</html>
