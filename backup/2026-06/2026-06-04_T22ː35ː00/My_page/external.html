<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外部サービス</title>
    <link rel="stylesheet" href="mypage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- SP用ハンバーガー -->
    <button class="hamburger" id="hamburgerBtn">
        <i class="fas fa-bars"></i>
    </button>

    <div class="page">

        <!-- サイドバー -->
        <aside class="sidebar" id="sidebar">

            <img src="./images/logo_white.png" class="logo" alt="Logo">

            <div class="menu-list">

                <a href="profile.html" class="menu">
                    <i class="fas fa-user"></i>
                    本人情報
                </a>

                <a href="account.html" class="menu">
                    <i class="fas fa-id-card"></i>
                    アカウント情報
                </a>

                <a href="external.html" class="menu active">
                    <i class="fas fa-link"></i>
                    外部サービス
                </a>

                <a href="platforms.html" class="menu">
                    <i class="fas fa-cog"></i>
                    連携サービス
                </a>

            </div>

            <button class="btn logout-btn" id="logoutBtn">
                ログアウト
            </button>

        </aside>

        <!-- メイン -->
        <main class="main fade-in">

            <h1>EXTERNAL</h1>
            <div class="sub">外部サービス</div>

            <!-- Discord -->
            <div class="card">

                <div class="section-title">
                    Discord
                </div>

                <div class="row">
                    <div class="label">
                        <i class="fab fa-discord"></i>
                        接続状態
                    </div>

                    <div class="value">
                        未接続
                    </div>
                </div>

                <button class="btn edit-btn">
                    接続する
                </button>

                <div style="clear: both;"></div>

            </div>

            <!-- X -->
            <div class="card">
                <div class="section-title">
                    X (Twitter)
                </div>

                <div class="row">
                    <div class="label">
                        <i class="fa-brands fa-x-twitter"></i>
                        接続状態
                    </div>

                    <div class="value">
                        未接続
                    </div>
                </div>

                <button class="btn edit-btn">
                    接続する
                </button>

                <div style="clear: both;"></div>
            </div>

            <!-- GitHub -->
            <div class="card">

                <div class="section-title">
                    GitHub
                </div>

                <div class="row">
                    <div class="label">
                        <i class="fab fa-github"></i>
                        接続状態
                    </div>

                    <div class="value">
                        未接続
                    </div>
                </div>

                <button class="btn edit-btn">
                    接続する
                </button>

                <div style="clear: both;"></div>

            </div>

        </main>

    </div>

    <script type="module">

        import { auth } from "../firebase-config.js";
        import {
            signOut
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        const hamburgerBtn =
            document.getElementById("hamburgerBtn");

        const sidebar =
            document.getElementById("sidebar");

        const logoutBtn =
            document.getElementById("logoutBtn");

        hamburgerBtn.addEventListener("click", () => {
            sidebar.classList.toggle("open");
        });

        logoutBtn.addEventListener("click", async () => {

            if (confirm("ログアウトしますか？")) {

                await signOut(auth);

                window.location.href =
                    "/Login_page/";

            }

        });

    </script>

</body>

</html>
