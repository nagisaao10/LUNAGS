<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | LUNAGS System</title>
    <link rel="stylesheet" href="./shared/normalize.css">
    <link rel="stylesheet" href="./shared/common.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family: var(--font);
            color: var(--ink);

            background:
                radial-gradient(circle at top left,
                    var(--surface-blue),
                    transparent 40%),
                var(--surface-soft);
        }

        /* =========================
            404 Page
        ========================= */

        .error-page {
            width: min(620px, 100%);

            padding: 48px 40px;

            text-align: center;

            background: var(--surface);

            border: 1px solid var(--line);
            border-radius: var(--radius);

            box-shadow: var(--shadow);
        }

        .error-code {
            margin: 0;

            color: var(--blue-600);

            font-size: clamp(72px, 16vw, 140px);
            font-weight: 800;

            line-height: 1;
            letter-spacing: 0.04em;
        }

        .error-title {
            margin: 20px 0 10px;

            font-size: clamp(24px, 5vw, 36px);
            font-weight: 700;
        }

        .error-message {
            margin: 0;

            color: var(--muted);

            font-size: 15px;
            line-height: 1.8;
        }

        .error-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 44px;

            margin-top: 28px;
            padding: 0 22px;

            border-radius: var(--radius);

            background: var(--blue-600);
            color: var(--surface);

            font-weight: 600;
            text-decoration: none;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .error-link:hover {
            background: var(--blue-700);
            transform: translateY(-2px);
        }

        /* =========================
            Mobile
        ========================= */

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .error-page {
                padding: 36px 24px;
            }
        }
    </style>
</head>

<body>
    <h1>404 Not Found</h1>
    <p>お探しのページは見つかりませんでした。</p>
</body>

</html>
