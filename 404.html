<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ページが見つかりません | LUNAGS System</title>

    <link rel="stylesheet" href="/shared/normalize.css">
    <link rel="stylesheet" href="/shared/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/404.css">
</head>

<body>
    <div class="error-layout">

        <aside class="error-rail">
            <div class="error-brand">
                <img src="/images/logo_LUNAGS.png" alt="LUNAGS">

                <div class="error-brand__divider"></div>

                <span class="error-brand__label">SYSTEM</span>
            </div>

            <nav class="error-nav" aria-label="メインメニュー">
                <a class="error-nav__link" href="/launcher.html">
                    <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>
                    <span>ランチャー</span>
                </a>
            </nav>
        </aside>

        <main class="error-main">

            <header class="error-topbar">
                <h1>ページが見つかりません</h1>
                <p>404 Not Found</p>
            </header>

            <section class="error-card" aria-labelledby="errorTitle">

                <div class="error-icon">
                    <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                </div>

                <p class="error-code" aria-label="エラーコード 404">
                    404
                </p>

                <h2 class="error-title" id="errorTitle">
                    お探しのページは見つかりませんでした
                </h2>

                <p class="error-message">
                    URLが変更または削除された可能性があります。
                    ランチャーから目的のページを開いてください。
                </p>

                <a class="error-link" href="/launcher.html">
                    <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>
                    <span>ランチャーへ戻る</span>
                </a>

            </section>

        </main>

    </div>
</body>

</html>
