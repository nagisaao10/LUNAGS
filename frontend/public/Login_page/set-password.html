<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード設定 | LUNAGS 管理システム</title>
    <link rel="stylesheet" href="../normalize.css">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="box">
        <h2>パスワード設定</h2>
        <p id="emailLabel"></p>
        <input id="password" type="password" placeholder="パスワード">
        <input id="password2" type="password" placeholder="パスワード確認">
        <div id="message" class="message"></div>
        <button id="registerButton" onclick="register()">登録する</button>
        <button id="loginButton" style="display:none;background:#eef2f7;color:#333;"
            onclick="location.href='login.html'">
            ログインに戻る
        </button>
        <button id="restartButton" style="display:none;background:#eef2f7;color:#333;"
            onclick="location.href='signup.html'">
            新規登録へ戻る
        </button>
    </div>

    <script type="module">
        import {
            createUserWithEmailAndPassword,
            fetchSignInMethodsForEmail,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { deleteDoc, doc, getDoc, setDoc } from
            "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
        import {
            auth,
            db,
            serverTimestamp,
            VERIFICATION_COLLECTION,
            loadPendingSignup,
            clearPendingSignup,
            loadLocalVerification,
            clearLocalVerification,
            withTimeout,
            isOfflineDocumentError,
            getFriendlyErrorMessage
        } from "../firebase-config.js";

        // user_idを生成する関数
        function generateUserId() {
            const chars =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

            let id = "U";

            const bytes = crypto.getRandomValues(
                new Uint8Array(7)
            );

            for (let i = 0; i < 7; i++) {
                id += chars[bytes[i] % chars.length];
            }

            return id;
        }

        async function generateUniqueUserId() {
            while (true) {
                const userId = generateUserId();

                const snap = await getDoc(
                    doc(db, "users", userId)
                );

                if (!snap.exists()) {
                    return userId;
                }
            }
        }

        const pendingSignup = loadPendingSignup();

        if (!pendingSignup?.email) {
            window.location.href = "signup.html";
        } else {
            document.getElementById("emailLabel").innerText = pendingSignup.email;
        }

        function setMessage(text, type = "") {
            const message = document.getElementById("message");
            message.className = `message ${type}`;
            message.innerText = text;
        }

        window.register = async () => {
            const button = document.getElementById("registerButton");
            const password = document.getElementById("password").value;
            const password2 = document.getElementById("password2").value;
            const restartButton = document.getElementById("restartButton");
            const loginButton = document.getElementById("loginButton");

            if (password.length < 6) { setMessage("パスワードは6文字以上で入力してください", "error"); return; } if (password !== password2) {
                setMessage("パスワードが一致しません", "error"); return;
            } button.disabled = true; setMessage("登録処理を実行しています..."); try {
                const
                    ref = doc(db, VERIFICATION_COLLECTION, pendingSignup.email); let data; let usesLocalVerification = false; try {
                        const snap = await withTimeout(getDoc(ref)); if (!snap.exists()) {
                            throw new Error("確認状態が見つかりません。最初からやり直してください。");
                        } data = snap.data();
                    } catch (error) {
                        if (!isOfflineDocumentError(error)) { throw error; }
                        data = loadLocalVerification(pendingSignup.email); usesLocalVerification = true; if (!data) {
                            throw new
                                Error("確認状態が見つかりません。最初からやり直してください。");
                        }
                    } if (!data.verified) { throw new Error("メール認証が完了していません"); } if
                    (Date.now() > data.expiresAt) {
                    if (usesLocalVerification) {
                        clearLocalVerification(pendingSignup.email);
                    } else {
                        await deleteDoc(ref);
                    }
                    throw new Error("認証済みコードの有効期限が切れました。最初からやり直してください。");
                }

                const methods = await withTimeout(fetchSignInMethodsForEmail(auth, pendingSignup.email));
                if (methods.length > 0) {
                    throw new Error("このメールアドレスはすでに登録されています");
                }

                const userCredential = await withTimeout(createUserWithEmailAndPassword(
                    auth, pendingSignup.email, password), "登録通信がタイムアウトしました");

                await withTimeout(updateProfile(userCredential.user, {
                    displayName: pendingSignup.name
                }), "プロフィール更新がタイムアウトしました");

                // ホロライブ風ID生成
                const customUserId = await generateUniqueUserId();

                await setDoc(
                    doc(db, "users", customUserId),
                    {
                        uid: userCredential.user.uid,

                        name: pendingSignup.name,
                        displayName: pendingSignup.name,

                        email: pendingSignup.email,

                        birthday: "",
                        gender: "",
                        country: "",
                        address: "",
                        phone: "",

                        createdAt: serverTimestamp()
                    });

                await setDoc(doc(db, "uidMap", userCredential.user.uid), {
                    userId: customUserId
                });

                if (usesLocalVerification) {
                    clearLocalVerification(pendingSignup.email);
                } else {
                    await withTimeout(deleteDoc(ref));
                }
                clearPendingSignup();

                setMessage("登録が完了しました", "success");
                setTimeout(() => {
                    window.location.href = "./setup.html";
                }, 800);
            } catch (error) {

                const restartButton = document.getElementById("restartButton");
                const loginButton = document.getElementById("loginButton");

                let message = getFriendlyErrorMessage(error, "登録に失敗しました");

                if (error.code === "auth/email-already-in-use") {
                    message = "このメールアドレスは既に登録されています";
                    restartButton.style.display = "block";
                    loginButton.style.display = "block";
                }
                else if (error.code === "auth/weak-password") {
                    message = "パスワードが弱すぎます";
                    restartButton.style.display = "none";
                    loginButton.style.display = "none";
                }
                else if (error.code === "auth/invalid-email") {
                    message = "メールアドレスの形式が正しくありません";
                    restartButton.style.display = "none";
                    loginButton.style.display = "none";
                }
                else if (error.code === "auth/network-request-failed") {
                    message = "ネットワークエラーが発生しました";
                    restartButton.style.display = "none";
                    loginButton.style.display = "none";
                }
                else if (
                    message.includes("有効期限が切れました") ||
                    message.includes("確認状態が見つかりません")
                ) {
                    restartButton.style.display = "block";
                    loginButton.style.display = "none";
                } else {
                    restartButton.style.display = "none";
                    loginButton.style.display = "none";
                }

                setMessage(message, "error");
                console.error(error);

            } finally {
                button.disabled = false;
            }
        };
    </script>

</body>

</html>
