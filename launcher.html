<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launcher | LUNAGS system</title>
    <link rel="stylesheet" href="./shared/normalize.css">
    <link rel="stylesheet" href="./shared/common.css">

    <style>
        * {
            box-sizing: border-box;
        }



        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font);
            color: var(--ink);
            background:
                radial-gradient(circle at top left,
                    var(--surface-blue),
                    transparent 35%),
                var(--surface-soft);
        }

        /* =========================
           Header
        ========================= */

        header {
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 32px;

            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid var(--line);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--blue-700);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-name {
            font-size: 14px;
            color: var(--muted);
        }

        .logout-button {
            border: none;
            background: transparent;

            color: var(--muted);
            font-family: inherit;
            font-size: 13px;

            padding: 8px 12px;
            border-radius: var(--radius);

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .logout-button:hover {
            background: var(--surface-blue);
            color: var(--ink);
        }

        /* =========================
           Main
        ========================= */

        main {
            width: min(1100px, calc(100% - 40px));

            margin: 0 auto;
            padding: 70px 0 80px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 55px;
        }

        .welcome h1 {
            margin: 0 0 12px;

            font-size: clamp(30px, 5vw, 46px);
            font-weight: 700;

            letter-spacing: 0.03em;
        }

        .welcome p {
            margin: 0;

            color: var(--muted);
            font-size: 16px;
        }

        #displayName {
            color: var(--blue-700);
            font-weight: 600;
        }

        /* =========================
           Launcher
        ========================= */

        .launcher-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 28px;
        }

        .launcher-card.is-hidden {
            display: none;
        }

        .launcher-card {
            position: relative;

            min-height: 260px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            padding: 32px;

            background: var(--surface);

            border: 1px solid var(--line);
            border-radius: var(--radius);

            box-shadow: var(--shadow);

            text-decoration: none;
            color: inherit;

            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .launcher-card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -70px;
            top: -70px;

            border-radius: 50%;

            background: var(--surface-blue);

            transition:
                transform 0.3s ease;
        }

        .launcher-card:hover {
            transform: translateY(-4px);

            border-color: var(--blue-200);

            box-shadow:
                0 20px 48px rgba(29, 75, 150, 0.18);
        }

        .launcher-card:hover::before {
            transform: scale(1.25);
        }

        .card-top,
        .card-bottom {
            position: relative;
            z-index: 1;
        }

        /* =========================
           Card Icon
        ========================= */

        .card-icon {
            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 24px;

            border-radius: var(--radius);

            background: var(--surface-blue);

            color: var(--blue-700);

            font-size: 30px;
        }

        /* =========================
           Card Text
        ========================= */

        .card-title {
            margin: 0 0 8px;

            font-size: 26px;
            font-weight: 700;
        }

        .card-description {
            margin: 0;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.7;
        }

        /* =========================
           Card Bottom
        ========================= */

        .card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 25px;
        }

        .open-text {
            color: var(--blue-700);

            font-size: 14px;
            font-weight: 600;
        }

        .arrow {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--blue-500);

            color: var(--surface);

            font-size: 18px;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .launcher-card:hover .arrow {
            transform: translateX(4px);
            background: var(--blue-600);
        }

        /* =========================
           Loading
        ========================= */

        #loading {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--surface-soft);

            z-index: 1000;

            transition: opacity 0.3s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            text-align: center;
        }

        .loading-logo {
            margin-bottom: 20px;

            font-size: 28px;
            font-weight: 700;

            color: var(--blue-700);
        }

        .loading-text {
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 700px) {
            header {
                height: 62px;
                padding: 0 18px;
            }

            .logo {
                font-size: 21px;
            }

            .user-name {
                display: none;
            }

            main {
                width: min(100% - 28px, 500px);

                padding: 50px 0 60px;
            }

            .welcome {
                margin-bottom: 35px;
            }

            .welcome h1 {
                font-size: 32px;
            }

            .welcome p {
                font-size: 14px;
            }

            .launcher-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .launcher-card {
                min-height: 220px;
                padding: 26px;
            }

            .card-title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <!-- =========================
         Header
    ========================== -->
    <header>

        <div class="logo">
            LUNAGS
        </div>

        <div class="header-right">

            <span id="userName" class="user-name">
                ログイン確認中...
            </span>

            <button id="logoutButton" class="logout-button">
                ログアウト
            </button>

        </div>

    </header>


    <!-- =========================
         Main
    ========================== -->

    <main>

        <section class="welcome">

            <h1>
                Welcome to LUNAGS
            </h1>

            <p>
                <span id="displayName">ユーザー</span>
                さん、どこへ行きますか？
            </p>

        </section>


        <!-- =========================
             Launcher Cards
        ========================== -->

        <section class="launcher-grid">

            <!-- My Page -->

            <a href="./account/mypage/profile.html" class="launcher-card">

                <div class="card-top">

                    <div class="card-icon">
                        👤
                    </div>

                    <h2 class="card-title">
                        My Page
                    </h2>

                    <p class="card-description">
                        プロフィールやアカウント情報、
                        外部サービスとの連携などを管理します。
                    </p>

                </div>

                <div class="card-bottom">

                    <span class="open-text">
                        My Pageを開く
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </div>

            </a>


            <!-- Shop -->

            <a href="./shop/" class="launcher-card">

                <div class="card-top">

                    <div class="card-icon">
                        🛒
                    </div>

                    <h2 class="card-title">
                        Shop
                    </h2>

                    <p class="card-description">
                        LUNAGSのショップへ移動します。
                        商品やサービスを確認できます。
                    </p>

                </div>

                <div class="card-bottom">

                    <span class="open-text">
                        Shopを開く
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </div>

            </a>


            <!-- Admin -->

            <a href="./account/admin/admin.html" class="launcher-card is-hidden" id="adminCard">
                <div class="card-top">

                    <div class="card-icon">
                        管
                    </div>

                    <h2 class="card-title">
                        Admin
                    </h2>

                    <p class="card-description" id="adminCardDescription">
                        管理者アカウントと管理者モードを確認します。
                    </p>

                </div>

                <div class="card-bottom">

                    <span class="open-text" id="adminCardStatus">
                        管理者ページを開く
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </div>

            </a>

        </section>

    </main>


    <!-- =========================
         Firebase
    ========================== -->

    <script type="module">

        import { auth, FUNCTIONS_ENDPOINT } from "./shared/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        const loading = document.getElementById("loading");
        const userName = document.getElementById("userName");
        const displayName = document.getElementById("displayName");
        const logoutButton = document.getElementById("logoutButton");
        const adminCard = document.getElementById("adminCard");
        const adminCardStatus = document.getElementById("adminCardStatus");
        const adminCardDescription = document.getElementById("adminCardDescription");

        function formatTime(value) {
            if (!value) return "-";

            return new Date(value).toLocaleTimeString(
                "ja-JP",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );
        }

        async function renderAdminCard(user) {
            const adminCard = document.getElementById("adminCard");

            if (!adminCard) {
                console.warn("adminCard が見つかりません");
                return;
            }

            adminCard.classList.add("is-hidden");

            try {
                const token = await user.getIdToken();

                const response = await fetch(
                    `${FUNCTIONS_ENDPOINT}/admin-status`,
                    {
                        method: "GET",
                        headers: {
                            Authorization: `Bearer ${token}`
                        }
                    }
                );

                if (!response.ok) {
                    console.error(
                        "管理者状態取得失敗:",
                        response.status,
                        await response.text()
                    );
                    return;
                }

                const result = await response.json();

                console.log("管理者状態:", result);

                if (!result.ok) {
                    return;
                }

                if (result.isAdminAccount || result.adminMode) {
                    adminCard.classList.remove("is-hidden");
                }
            } catch (error) {
                console.error(
                    "管理者状態を取得できませんでした:",
                    error
                );
            }
        }

        /*
         * ログイン状態を確認
         */

        onAuthStateChanged(auth, async (user) => {
            if (!user) {

                /*
                 * 未ログイン
                 *
                 * ログインページへ戻す
                 */

                window.location.href = "./account/login/login.html";
                return;
            }


            /*
             * ログイン済み
             */

            const name =
                user.displayName ||
                user.email?.split("@")[0] ||
                "ユーザー";


            userName.textContent = name;
            displayName.textContent = name;

            await renderAdminCard(user);


            /*
             * ローディング終了
             */

            if (loading) {
                loading.classList.add("hidden");
            }
        });


        /*
         * ログアウト
         */

        logoutButton.addEventListener("click", async () => {

            try {
                await signOut(auth);
                window.location.href = "./account/login/login.html";

            } catch (error) {
                console.error(
                    "ログアウトに失敗しました:",
                    error
                );
                alert(
                    "ログアウトに失敗しました。"
                );

            }

        });

    </script>

</body>

</html>
