<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ランチャー | LUNAGS System</title>
    <link rel="stylesheet" href="./shared/normalize.css">
    <link rel="stylesheet" href="./shared/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./launcher.css">
</head>

<body>
    <button class="hamburger" id="hamburgerBtn" type="button" aria-label="メニューを開く" aria-controls="sidebar"
        aria-expanded="false">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <div class="page">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__brand">
                <img src="./images/logo_LUNAGS.png" alt="LUNAGS" class="logo-lunags">
                <div class="sidebar__brand-divider"></div>
                <span class="sidebar__brand-subtitle">SYSTEM</span>
            </div>

            <nav class="menu-list" aria-label="メインメニュー">
                <a href="./launcher.html" class="menu active" aria-current="page">
                    <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>
                    <span>ランチャー</span>
                </a>
                <a href="./account/mypage/profile.html" class="menu">
                    <i class="fa-solid fa-user" aria-hidden="true"></i>
                    <span>マイページ</span>
                </a>
                <a href="./shop/shop.html" class="menu">
                    <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
                    <span>ショップ</span>
                </a>
                <a href="./management/dashboard/dashboard.html" class="menu">
                    <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                    <span>ダッシュボード</span>
                </a>
                <a href="./account/admin/admin.html" class="menu is-hidden" id="adminMenu">
                    <i class="fa-solid fa-user-shield" aria-hidden="true"></i>
                    <span>管理者</span>
                </a>
            </nav>

            <div class="sidebar__footer">
                <button class="logout-btn" id="logoutButton" type="button">
                    <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                    <span>ログアウト</span>
                </button>
            </div>
        </aside>

        <main class="main fade-in">
            <header class="topbar">
                <div>
                    <h1>ランチャー</h1>
                    <p class="sub"><span id="displayName">ユーザー</span> さんのLUNAGSポータル</p>
                </div>
            </header>

            <section class="launcher-panel" aria-labelledby="launcherTitle">
                <div class="launcher-panel__head">
                    <h2 id="launcherTitle">アプリケーション</h2>
                    <span class="pill">利用可能なサービス</span>
                </div>

                <div class="launcher-grid">
                    <a href="./account/mypage/profile.html" class="launcher-card">
                        <div class="card-top">
                            <div class="card-icon"><i class="fa-solid fa-user" aria-hidden="true"></i></div>
                            <h2 class="card-title">マイページ</h2>
                            <p class="card-description">プロフィールやアカウント情報、外部サービスとの連携を管理します。</p>
                        </div>
                        <div class="card-bottom">
                            <span class="open-text">マイページを開く</span>
                            <span class="arrow" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
                        </div>
                    </a>

                    <a href="./shop/" class="launcher-card">
                        <div class="card-top">
                            <div class="card-icon"><i class="fa-solid fa-bag-shopping" aria-hidden="true"></i></div>
                            <h2 class="card-title">ショップ</h2>
                            <p class="card-description">LUNAGSのショップへ移動し、商品やサービスを確認できます。</p>
                        </div>
                        <div class="card-bottom">
                            <span class="open-text">ショップを開く</span>
                            <span class="arrow" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
                        </div>
                    </a>

                    <a href="./management/dashboard/dashboard.html" class="launcher-card">
                        <div class="card-top">
                            <div class="card-icon"><i class="fa-solid fa-chart-line" aria-hidden="true"></i></div>
                            <h2 class="card-title">ダッシュボード</h2>
                            <p class="card-description">LUNAGSの管理情報を確認し、各種ツールへアクセスできます。</p>
                        </div>
                        <div class="card-bottom">
                            <span class="open-text">ダッシュボードを開く</span>
                            <span class="arrow" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
                        </div>
                    </a>

                    <a href="./account/admin/admin.html" class="launcher-card is-hidden" id="adminCard">
                        <div class="card-top">
                            <div class="card-icon"><i class="fa-solid fa-user-shield" aria-hidden="true"></i></div>
                            <h2 class="card-title">管理者</h2>
                            <p class="card-description" id="adminCardDescription">管理者アカウントと管理者モードを確認します。</p>
                        </div>
                        <div class="card-bottom">
                            <span class="open-text" id="adminCardStatus">管理者ページを開く</span>
                            <span class="arrow" aria-hidden="true"><i class="fa-solid fa-arrow-right"></i></span>
                        </div>
                    </a>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { auth, FUNCTIONS_ENDPOINT } from "./shared/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        const displayName = document.getElementById("displayName");
        const logoutButton = document.getElementById("logoutButton");
        const adminCard = document.getElementById("adminCard");
        const adminMenu = document.getElementById("adminMenu");
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebar = document.getElementById("sidebar");

        function setAdminLinksVisible(isVisible) {
            adminCard.classList.toggle("is-hidden", !isVisible);
            adminMenu.classList.toggle("is-hidden", !isVisible);
        }

        async function renderAdminCard(user) {
            setAdminLinksVisible(false);

            try {
                const token = await user.getIdToken();
                const response = await fetch(`${FUNCTIONS_ENDPOINT}/admin-status`, {
                    method: "GET",
                    headers: { Authorization: `Bearer ${token}` }
                });

                if (!response.ok) {
                    console.error("管理者状態取得失敗:", response.status, await response.text());
                    return;
                }

                const result = await response.json();
                setAdminLinksVisible(Boolean(result.ok && (result.isAdminAccount || result.adminMode)));
            } catch (error) {
                console.error("管理者状態を取得できませんでした:", error);
            }
        }

        hamburgerBtn.addEventListener("click", () => {
            const isOpen = sidebar.classList.toggle("open");
            hamburgerBtn.setAttribute("aria-expanded", String(isOpen));
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "./account/login/login.html";
                return;
            }

            const name = user.displayName || user.email?.split("@")[0] || "ユーザー";
            displayName.textContent = name;
            await renderAdminCard(user);
        });

        logoutButton.addEventListener("click", async () => {
            try {
                await signOut(auth);
                window.location.href = "./account/login/login.html";
            } catch (error) {
                console.error("ログアウトに失敗しました:", error);
                alert("ログアウトに失敗しました。");
            }
        });
    </script>
</body>

</html>
